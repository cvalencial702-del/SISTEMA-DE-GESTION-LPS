<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firma de aprobación · RQD · LPS</title>
<style>
  :root{--navy:#0A2540;--blue:#1598FF;--green:#16A34A;--danger:#DC2626;--slate:#5B6B7C;--line:#E2EBF3;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#EEF1F6;color:var(--navy);padding:14px;}
  .wrap{max-width:780px;margin:0 auto;}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(10,37,64,.08);overflow:hidden;margin-bottom:14px;}
  .hdr{background:var(--navy);color:#fff;padding:16px 18px;}.hdr h1{font-size:15px;}.hdr p{font-size:11px;color:#B0C9E4;margin-top:3px;}
  .body{padding:16px 18px;}
  label{font-size:10px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px;}
  input{width:100%;border:0.5px solid #D0DBE7;border-radius:7px;padding:9px 10px;font-size:12.5px;color:var(--navy);}
  canvas{border:1px dashed #C4D2E0;border-radius:8px;background:#FCFDFE;width:100%;height:110px;touch-action:none;cursor:crosshair;}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-p{background:var(--green);color:#fff;}.btn-g{background:#EEF3F8;color:var(--slate);}
  .msg{padding:14px;border-radius:10px;font-size:14px;text-align:center;}
  .ok{background:#DCFCE7;color:#166534;}.err{background:#FEE2E2;color:#991B1B;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:6px 8px;text-align:left;border-bottom:1px solid #F4F7FB;}
  th{color:var(--slate);font-size:10px;text-transform:uppercase;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr" style="display:flex;align-items:center;gap:12px;"><img id="logoHdr" style="height:32px;background:#fff;border-radius:6px;padding:2px 5px;"><div><h1>Aprobación de Solicitud RFQ</h1><p>Solicitud de cotización · Grupo LPS</p></div></div>
    <div class="body" id="contenido"><div class="msg">Cargando…</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kssoegcjwngsnfwdvjne.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtzc29lZ2Nqd25nc25md2R2am5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjE3OTMsImV4cCI6MjA5OTAzNzc5M30.rtvKepiLyKEMkJPxTHw336E6UEoPyAkEX_5jU7WgGM4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const LOGO_LPS='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEEAAAAoCAYAAAChDJfXAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAARTSURBVGhD7ZltTJVlGMd/13OAA4UBSrBJaNPRMhWVOc2FOZnLMnKu2rK15UzZilxv9MnUrZq9aFlfWl9ac+U0k3Q4tZKpaWENBk1bDJFASYgQ5OUAh/P2XH24D6HHD22n5zSbz+/T2Tn3ue/r+T3X/T/3syOqqtzkWLFv3Iy4ElwJBleCK8HgSnAlGFwJrgSDK8GVYHAluBIMroR4JSjwx7DSMQROP4grcNmv+MOxnySO+CQovHISyo8rEQclqMJwEMqqhYqTMByKHZEY4pIA0BeA/lGwHZKgCi39sPqI0tANh9rgnTrFF4wd6TxxS4glbIM/DMEIDIWgN9rStpoWtxUCEegegc4hZSR0rUB/GDacgLM9whuLYMVUZWejsLXWzJlIHJFgKxz8TSmpNFtk8V6Yv1t4YD/sboKIDRcGlMcPwbKvlNIqePAAHG4bt/DdJWi8AmvvUZ6aAW8tFmZOUvacgzd/MgIThSMSiN7Jiz5ougLbFyv7SiHLq2w6DbVdsPccnL0MVSuFmieE6Zmwo0H+bve7s5SMFKg8D819yvcdSkuf4BH4tBE+aFBCduyqzuCYBIBkCzYvFJZOEYpy4LUFELKhplNJT4Gwwvv1cKBFKS+Ej0ogLcl8d2qG8PZ9ylBIWPMNVJwS8icoux9S7s9TPj4jHG5VxzLoav6VhNh6kiyYlAYeARG4/RYBYCAAjxUIq6Yrv/YqW2uFddVK24CSFK3AI7A0X1h+p037kBC24fVFUJQjfLgEkiyluv36NZ0gbgkpFgwGhWBkPOBGw1DbZdo2bENdlyJAQaZwrN1mTray/xHhyCpIT4ZtdSYvACIKu5qUby9aTL5VCdqwqQZaB5Tnjwv+iLAkz8znNHFJEIGSfOgZhTVHlX3NxoICO+qhrFp56YSy+UcTbkungC8kbKu32NmofH1B8YWEolzBilZQ06G8Vy8UZitVK4XtxdA5IpRWCae74NnZ8GiBhZUAC/FJANbPEspmKf6wELZNZUkCW+4Vki2T9E/PMEF4RzqsnSlsmAOVzfDJL/DkXfBusZkLzPhABFYXKHnpsGwq5KcrgQg8V6hsXACeuKr9ZyTef6DGfvvHtsKX55SNp4XPlsP8XBgIKKlJRohHFEsEf1gZDgmZqeALwkQveKPB2OOH9dVwtgcqiuDY79DQDS/OhfK54PVcs7yjxC3hamyFPU1GwufLYTCoqMLP3cq0DMhOE7K8wsFWpSgXctKgYwj+HIEX5gki5sR4vh+eOQqtg5DqgVeLlLJCIzKRODr9WGtneYXeUUjxwMPTLHpH4UyPYiMMBiDDK/hCMCFl3L8IFGTCFytgxkRly0Jl3ezEC8CpTlCFUx3Kribh5Xkm6S/5lMJsYXL6+NH5hw4ozjN7O2ybDJGYoFNgMAC3ecelJhpHJBDdEhGNnhGiFyPR12OoXn/RNwKOSfg/8x/suBsfV4IrweBKcCUYXAmuBIMrAfgLhJ7NVYtfXl4AAAAASUVORK5CYII=';
let reg=null, its=[], firma=null;

function tok(){ return new URLSearchParams(location.search).get('token'); }
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){ n=Number(n)||0; return '$'+n.toLocaleString('es-CO'); }

function cargar(){
  document.getElementById('logoHdr').src=LOGO_LPS;
  _cargar();
}
async function _cargar(){
  const t=tok(); const c=document.getElementById('contenido');
  if(!t){ c.innerHTML='<div class="msg err">Enlace inválido.</div>'; return; }
  const {data}=await sb.from('rfq_solicitudes').select('*').eq('firma_token',t).limit(1);
  if(!data||!data.length){ c.innerHTML='<div class="msg err">No se encontró la solicitud.</div>'; return; }
  reg=data[0];
  const {data:items}=await sb.from('rfq_items').select('*').eq('rfq_id',reg.id).order('orden');
  its=items||[];
  if(reg.estado==='aprobado'||reg.estado==='rechazado'){ pintarFirmada(); return; }
  pintarFormulario();
}

function pintarFormulario(){
  const cli=reg.cliente==='Otros'?(reg.cliente_otro||'Otros'):reg.cliente;
  const seg=reg.segmento==='Otros'?(reg.segmento_otro||'Otros'):reg.segmento;
  const f=Number(reg.presupuesto_facturacion)||0,co=Number(reg.presupuesto_costo)||0,m=f-co;
  const filas=its.map((it,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(it.descripcion)+'</td><td>'+esc(it.alcance||'')+'</td><td style="text-align:center;">'+esc(it.cantidad)+'</td><td>'+esc(it.unidad)+'</td></tr>').join('');
  document.getElementById('contenido').innerHTML=
    '<div class="msg" style="background:#EAF5FF;color:#0C447C;margin-bottom:12px;">Revise la solicitud y firme para aprobar. Al firmar se emitirá la OT.</div>'+
    '<div class="grid" style="font-size:13px;margin-bottom:12px;">'+
      '<div><strong>Cliente:</strong> '+esc(cli)+'</div><div><strong>Segmento:</strong> '+esc(seg)+'</div>'+
      '<div><strong>Lugar:</strong> '+esc(reg.lugar_ejecucion||'—')+'</div><div><strong>Fecha entrega:</strong> '+esc(reg.fecha_entrega||'—')+'</div>'+
      '<div><strong>Solicitante:</strong> '+esc(reg.solicitante||'—')+'</div><div><strong>Facturación:</strong> '+money(f)+'</div>'+
    '</div>'+
    '<table><thead><tr><th>#</th><th>Descripción</th><th>Alcance</th><th>Cant.</th><th>Unidad</th></tr></thead><tbody>'+(filas||'<tr><td colspan="5" style="text-align:center;color:#999;">Sin ítems</td></tr>')+'</tbody></table>'+
    '<div style="margin:10px 0;font-size:13px;"><strong>Margen:</strong> '+money(m)+(f>0?' ('+((m/f)*100).toFixed(1)+'%)':'')+'</div>'+
    '<div style="border-top:1px solid #EEF3F8;margin-top:14px;padding-top:14px;">'+
      '<div class="grid"><div><label>Nombre del aprobador *</label><input id="ap_nom"></div><div><label>Cargo</label><input id="ap_cargo"></div></div>'+
      '<label style="margin-top:10px;">Firma *</label><canvas id="firmaC" width="700" height="110"></canvas>'+
      '<div style="text-align:right;"><button class="btn btn-g" style="padding:5px 10px;font-size:11px;" onclick="limpiar()">Borrar firma</button></div>'+
      '<div class="row"><button class="btn btn-p" onclick="aprobar()">✔ Firmar y emitir OT</button><button class="btn btn-g" onclick="rechazar()">✖ Rechazar</button></div>'+
    '</div>';
  setupFirma();
}

function setupFirma(){
  const c=document.getElementById('firmaC');
  const rect=c.getBoundingClientRect(); if(rect.width>0){c.width=Math.round(rect.width);c.height=Math.round(rect.height);}
  const ctx=c.getContext('2d'); ctx.strokeStyle='#0A2540';ctx.lineWidth=2;ctx.lineCap='round'; firma={ctx,hay:false,canvas:c}; let dib=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
  const st=e=>{e.preventDefault();dib=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  const mv=e=>{if(!dib)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();firma.hay=true;};
  const en=()=>dib=false;
  c.onmousedown=st;c.onmousemove=mv;c.onmouseup=en;c.onmouseleave=en;c.ontouchstart=st;c.ontouchmove=mv;c.ontouchend=en;
}
function limpiar(){ if(firma){firma.ctx.clearRect(0,0,firma.canvas.width,firma.canvas.height);firma.hay=false;} }

async function aprobar(){
  const nom=document.getElementById('ap_nom').value.trim();
  const cargo=document.getElementById('ap_cargo').value.trim();
  if(!nom){ alert('Ingrese su nombre'); return; }
  if(!firma||!firma.hay){ alert('Debe firmar para aprobar'); return; }
  const firmaData=firma.canvas.toDataURL('image/png');
  try{
    // Asignar consecutivo SOLO ahora, al firmar
    let consecutivo=reg.consecutivo;
    if(!consecutivo){ const {data,error}=await sb.rpc('rfq_siguiente_ot'); if(error)throw error; consecutivo=data; }
    await sb.from('rfq_solicitudes').update({
      consecutivo, estado:'aprobado',
      aprobador:nom, aprobador_cargo:cargo, aprobador_firma:firmaData, aprobador_fecha:new Date().toISOString()
    }).eq('id',reg.id);
    await sb.from('rfq_bitacora').insert({rfq_id:reg.id,consecutivo,usuario:nom,accion:'firmar_aprobar',detalle:'Aprobada y emitida por link'});
    document.getElementById('contenido').innerHTML='<div class="msg ok">✅ Solicitud aprobada y emitida como <strong>'+esc(consecutivo)+'</strong>.<br>Gracias, '+esc(nom)+'.</div>';
  }catch(e){ alert('Error: '+e.message); }
}
async function rechazar(){
  const nom=document.getElementById('ap_nom').value.trim();
  if(!nom){ alert('Ingrese su nombre para rechazar'); return; }
  const motivo=prompt('Motivo del rechazo:');
  if(!motivo){ alert('El motivo es obligatorio'); return; }
  try{
    await sb.from('rfq_solicitudes').update({estado:'rechazado',aprobador:nom,aprobador_fecha:new Date().toISOString(),motivo_rechazo:motivo}).eq('id',reg.id);
    await sb.from('rfq_bitacora').insert({rfq_id:reg.id,consecutivo:reg.consecutivo,usuario:nom,accion:'firmar_rechazar',detalle:motivo});
    document.getElementById('contenido').innerHTML='<div class="msg err">Solicitud rechazada. Motivo registrado.</div>';
  }catch(e){ alert('Error: '+e.message); }
}
function pintarFirmada(){
  const estado=reg.estado==='aprobado'?'aprobada y emitida como '+esc(reg.consecutivo):'rechazada';
  document.getElementById('contenido').innerHTML='<div class="msg '+(reg.estado==='aprobado'?'ok':'err')+'">Esta solicitud ya fue '+estado+'.</div>';
}
cargar();
</script>
</body>
</html>
