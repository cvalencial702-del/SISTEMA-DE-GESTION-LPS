<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipos de Trabajo en Alturas · LPS</title>
<style>
  :root{--navy:#0A2540;--blue:#1598FF;--blue-d:#0C6BC4;--green:#16A34A;--amber:#D97706;--danger:#DC2626;--slate:#5B6B7C;--line:#E2EBF3;--bg:#EEF1F6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--navy);}
  .hidden{display:none!important;}
  input,select,textarea{width:100%;border:0.5px solid #D0DBE7;border-radius:7px;padding:9px 10px;font-size:12.5px;color:var(--navy);font-family:inherit;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  input[readonly]{background:#F1F5F9;color:#5B6B7C;}
  label{font-size:10px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;}
  .req{color:var(--danger);}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-p{background:var(--blue);color:#fff;}.btn-navy{background:var(--navy);color:#fff;}.btn-green{background:var(--green);color:#fff;}
  .btn-g{background:#EEF3F8;color:#42505E;border:0.5px solid #D0DBE7;}
  .btn-sm{border:none;background:#EAF5FF;color:var(--blue-d);border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer;}
  .pill{padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:600;display:inline-block;}
  .pill-ok{background:#DCFCE7;color:#166534;}.pill-no{background:#FEE2E2;color:#991B1B;}.pill-obs{background:#FEF3C7;color:#92600A;}.pill-gray{background:#EEF3F8;color:#5B6B7C;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:9px 8px;font-weight:600;color:var(--slate);border-bottom:1px solid #EEF3F8;font-size:10.5px;text-transform:uppercase;}
  td{padding:8px;border-bottom:1px solid #F4F7FB;vertical-align:top;}
  .card{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px;}
  .topbar{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .logo{height:30px;background:#fff;border-radius:6px;padding:2px 5px;margin-right:10px;}
  .wrap{max-width:1180px;margin:0 auto;padding:22px;}
  .sec-title{font-size:18px;font-weight:600;margin-bottom:3px;}
  .sec-sub{font-size:11.5px;color:var(--slate);margin-bottom:16px;}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
  .kpi{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:14px;border-left:4px solid var(--slate);}
  .kpi .n{font-size:24px;font-weight:700;}.kpi .t{font-size:10px;color:var(--slate);text-transform:uppercase;}
  .modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:14px;padding:22px;width:820px;max-width:96vw;max-height:92vh;overflow:auto;}
  .field-sec{margin-bottom:8px;}.field-sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue-d);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:10px;}
  a.codelink{color:var(--blue-d);font-weight:700;font-family:ui-monospace,monospace;cursor:pointer;text-decoration:none;}
  .foto-prev{width:100%;height:130px;object-fit:contain;background:#F1F5F9;border-radius:8px;border:1px dashed #C4D2E0;}
  .filtros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;"><img id="logoTop" class="logo"><div><div style="font-size:15px;font-weight:600;">Equipos de Trabajo en Alturas</div><div style="font-size:10px;color:#7FA8D4;">Inspección y control · SIG</div></div></div>
  <div style="display:flex;gap:8px;align-items:center;">
    <div id="adminBtn"></div>
    <a href="procesos-gestion.html" style="color:#fff;font-size:11px;text-decoration:none;opacity:.8;">← Volver</a>
  </div>
</div>
<div class="wrap">
  <div class="sec-title">Inventario de equipos</div>
  <div class="sec-sub" id="subT">Equipos de protección contra caídas · código automático por tipo</div>

  <div class="kpis" id="kpis"></div>

  <div class="card" style="padding:12px 14px;">
    <div class="filtros">
      <div><label>Tipo de equipo</label><select id="fl_tipo" onchange="render()"><option value="">Todos</option></select></div>
      <div><label>Gestor</label><select id="fl_gestor" onchange="render()"><option value="">Todos</option></select></div>
      <div><label>Próxima inspección</label><select id="fl_venc" onchange="render()"><option value="">Todas</option><option value="vencida">Vencidas</option><option value="30">Vence ≤30 días</option><option value="vigente">Vigentes</option><option value="sin">Sin fecha</option></select></div>
      <div><label>Resultado última inspección</label><select id="fl_res" onchange="render()"><option value="">Todos</option><option>Apto</option><option>Apto con observaciones</option><option>No apto</option><option value="sin">Sin inspección</option></select></div>
      <div><label>Buscar (código, marca, serie…)</label><input id="fl_txt" oninput="render()" placeholder="Texto…"></div>
      <div style="display:flex;align-items:flex-end;gap:6px;"><button class="btn btn-g" style="flex:1;" onclick="limpiarFiltros()">Limpiar</button><button class="btn btn-p" id="btnNuevo" onclick="formEquipo()" style="flex:1;">＋ Equipo</button></div>
    </div>
  </div>

  <div class="card" style="padding:6px 14px 14px;overflow-x:auto;">
    <table><thead><tr><th>Código</th><th>Tipo</th><th>Marca / Ref.</th><th>Gestor</th><th>Última insp.</th><th>Próxima inspección</th><th>Resultado</th><th></th></tr></thead>
    <tbody id="tbody"></tbody></table>
  </div>
</div>
<div id="modalRoot"></div>

// Tipos con su prefijo de código
const TIPOS=[
  {nombre:'Arnés',prefijo:'ARN'},
  {nombre:'Eslinga de posicionamiento',prefijo:'ESP'},
  {nombre:'Eslinga con absorbedor',prefijo:'ESA'},
  {nombre:'Eslinga de restricción',prefijo:'ESR'},
  {nombre:'Tie off',prefijo:'TIE'},
  {nombre:'Freno',prefijo:'FRE'},
  {nombre:'Mosquetón',prefijo:'MOS'},
  {nombre:'Línea de vida',prefijo:'LIN'},
  {nombre:'Escalera',prefijo:'ESC'},
  {nombre:'Otros',prefijo:'OTR'}
];
function prefijoDe(tipo){ const t=TIPOS.find(x=>x.nombre===tipo); return t?t.prefijo:'OTR'; }
let esAdmin=false, usuario='Usuario';
let equipos=[], inspecciones=[];

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function abrirModal(html){ document.getElementById('modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+html+'</div></div>'; }
function cerrarModal(){ document.getElementById('modalRoot').innerHTML=''; }

function pillResultado(r){
  if(r==='Apto') return '<span class="pill pill-ok">Apto</span>';
  if(r==='No apto') return '<span class="pill pill-no">No apto</span>';
  if(r==='Apto con observaciones') return '<span class="pill pill-obs">Apto c/obs</span>';
  return '<span class="pill pill-gray">Sin inspección</span>';
}
function ultimaInspeccion(equipoId){
  const insp=inspecciones.filter(i=>i.equipo_id===equipoId).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  return insp[0]||null;
}
function diasParaProxima(equipoId){
  const ui=ultimaInspeccion(equipoId);
  if(!ui||!ui.proxima_inspeccion) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const v=new Date(ui.proxima_inspeccion+'T00:00:00');
  if(isNaN(v.getTime())) return null;
  return Math.round((v-hoy)/(1000*60*60*24));
}
function estadoVencimiento(equipoId){
  const d=diasParaProxima(equipoId);
  if(d===null) return {txt:'—',cls:''};
  if(d<0) return {txt:'Vencida ('+Math.abs(d)+'d)',cls:'pill-no',dias:d};
  if(d<=30) return {txt:'Vence en '+d+'d',cls:'pill-obs',dias:d};
  return {txt:'Vigente',cls:'pill-ok',dias:d};
}

// ===== Admin =====
function pintarAdminBtn(){
  document.getElementById('adminBtn').innerHTML=esAdmin
    ? '<span class="pill pill-ok" style="margin-right:6px;">🔓 SIG</span><button class="btn-sm" onclick="bloquearAdmin()">Bloquear</button>'
    : '<button class="btn-sm" onclick="pedirAdmin()">🔒 Modo administrador</button>';
  document.getElementById('btnNuevo').style.display=esAdmin?'':'none';
}
function pedirAdmin(){
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:10px;">Modo administrador (SIG)</div>'+
    '<div class="sec-sub">Crear, editar y eliminar requieren clave LPS-SIG.</div>'+
    '<label>Su nombre</label><input id="ad_nom" value="'+esc(usuario==='Usuario'?'':usuario)+'">'+
    '<div style="height:8px;"></div><label>Clave</label><input type="password" id="ad_clave" onkeydown="if(event.key===\'Enter\')validarAdmin()">'+
    '<div id="adErr" style="color:var(--danger);font-size:11px;margin-top:8px;"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-p" onclick="validarAdmin()">Desbloquear</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div>');
}
function validarAdmin(){
  if(document.getElementById('ad_clave').value!==CLAVE_ADMIN){ document.getElementById('adErr').textContent='Clave incorrecta.'; return; }
  esAdmin=true; const n=document.getElementById('ad_nom').value.trim(); if(n)usuario=n;
  cerrarModal(); pintarAdminBtn(); render();
}
function bloquearAdmin(){ esAdmin=false; pintarAdminBtn(); render(); }

// ===== Carga =====
async function cargar(){
  document.getElementById('logoTop').src=LOGO_LPS;
  document.getElementById('fl_tipo').innerHTML='<option value="">Todos</option>'+TIPOS.map(t=>'<option>'+esc(t.nombre)+'</option>').join('');
  const [eq,insp]=await Promise.all([
    sb.from('alt_equipos').select('*').eq('estado','activo').order('codigo'),
    sb.from('alt_inspecciones').select('*')
  ]);
  equipos=eq.data||[]; inspecciones=insp.data||[];
  // Poblar gestores
  const gestores=[]; const vistos={};
  equipos.forEach(e=>{ const g=(e.gestor||'').trim(); if(g&&!vistos[g.toLowerCase()]){ vistos[g.toLowerCase()]=g; gestores.push(g); } });
  gestores.sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
  const selG=document.getElementById('fl_gestor'); const act=selG.value;
  selG.innerHTML='<option value="">Todos</option>'+gestores.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join(''); if(act)selG.value=act;
  pintarAdminBtn(); render();
}

function limpiarFiltros(){ ['fl_tipo','fl_gestor','fl_venc','fl_res','fl_txt'].forEach(id=>document.getElementById(id).value=''); render(); }

function filtrar(){
  const t=document.getElementById('fl_tipo').value, r=document.getElementById('fl_res').value;
  const g=document.getElementById('fl_gestor').value, venc=document.getElementById('fl_venc').value;
  const txt=(document.getElementById('fl_txt').value||'').toLowerCase();
  return equipos.filter(e=>{
    if(t&&e.tipo!==t) return false;
    if(g&&(e.gestor||'').trim().toLowerCase()!==g.toLowerCase()) return false;
    const ui=ultimaInspeccion(e.id);
    if(r==='sin'&&ui) return false;
    if(r&&r!=='sin'&&(!ui||ui.resultado!==r)) return false;
    if(venc){
      const d=diasParaProxima(e.id);
      if(venc==='sin'&&d!==null) return false;
      if(venc==='vencida'&&!(d!==null&&d<0)) return false;
      if(venc==='30'&&!(d!==null&&d>=0&&d<=30)) return false;
      if(venc==='vigente'&&!(d!==null&&d>30)) return false;
    }
    if(txt){ const blob=((e.codigo||'')+' '+(e.marca||'')+' '+(e.referencia||'')+' '+(e.numero_serie||'')+' '+(e.numero_etiqueta||'')+' '+(e.responsable||'')+' '+(e.gestor||'')).toLowerCase(); if(!blob.includes(txt)) return false; }
    return true;
  });
}

function render(){
  const rows=filtrar();
  // KPIs
  let apto=0,noapto=0,sin=0,venc=0,porVencer=0;
  equipos.forEach(e=>{
    const ui=ultimaInspeccion(e.id); if(!ui)sin++; else if(ui.resultado==='No apto')noapto++; else apto++;
    const d=diasParaProxima(e.id);
    if(d!==null){ if(d<0)venc++; else if(d<=30)porVencer++; }
  });
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="t">Total equipos</div><div class="n">'+equipos.length+'</div></div>'+
    '<div class="kpi" style="border-left-color:var(--danger);cursor:pointer;" onclick="document.getElementById(\'fl_venc\').value=\'vencida\';render()"><div class="t">Inspección vencida</div><div class="n" style="color:var(--danger);">'+venc+'</div></div>'+
    '<div class="kpi" style="border-left-color:var(--amber);cursor:pointer;" onclick="document.getElementById(\'fl_venc\').value=\'30\';render()"><div class="t">Por vencer (≤30d)</div><div class="n" style="color:var(--amber);">'+porVencer+'</div></div>'+
    '<div class="kpi" style="border-left-color:var(--slate);cursor:pointer;" onclick="document.getElementById(\'fl_res\').value=\'sin\';render()"><div class="t">Sin inspección</div><div class="n">'+sin+'</div></div>';
  // Tabla
  document.getElementById('tbody').innerHTML=rows.length?rows.map(e=>{
    const ui=ultimaInspeccion(e.id);
    const tipoTxt=e.tipo==='Otros'?(e.tipo_otro||'Otros'):e.tipo;
    const ev=estadoVencimiento(e.id);
    let acc='<button class="btn-sm" onclick="verEquipo(\''+e.id+'\')">👁</button> <button class="btn-sm" style="background:#EDE9FE;color:#6D28D9;" onclick="pdfEquipo(\''+e.id+'\')">📄</button>';
    if(esAdmin) acc+=' <button class="btn-sm" onclick="formEquipo(\''+e.id+'\')">✏️</button> <button class="btn-sm" style="background:#FEE2E2;color:#991B1B;" onclick="eliminarEquipo(\''+e.id+'\')">🗑</button>';
    return '<tr><td><a class="codelink" onclick="verEquipo(\''+e.id+'\')">'+esc(e.codigo||'—')+'</a></td>'+
      '<td>'+esc(tipoTxt)+'</td>'+
      '<td>'+esc(e.marca||'—')+'<div style="font-size:9px;color:var(--slate);">'+esc(e.referencia||'')+'</div></td>'+
      '<td>'+esc(e.gestor||'—')+'</td>'+
      '<td>'+(ui?esc(ui.fecha):'—')+'</td>'+
      '<td>'+(ui&&ui.proxima_inspeccion?esc(ui.proxima_inspeccion):'—')+(ev.cls?' <span class="pill '+ev.cls+'" style="font-size:9px;">'+ev.txt+'</span>':'')+'</td>'+
      '<td>'+pillResultado(ui?ui.resultado:null)+'</td>'+
      '<td style="white-space:nowrap;">'+acc+'</td></tr>';
  }).join(''):'<tr><td colspan="8" style="text-align:center;color:var(--slate);padding:20px;">Sin equipos que coincidan</td></tr>';
}

// ===== Formulario de equipo =====
let fotoTmp=null;
function formEquipo(id){
  if(!esAdmin){ alert('Solo el administrador (LPS-SIG) puede crear o editar equipos.'); return; }
  const e=id?equipos.find(x=>x.id===id):{};
  fotoTmp=e.foto||null;
  const editar=!!id;
  abrirModal('<div style="font-size:16px;font-weight:600;margin-bottom:2px;">'+(editar?'Editar':'Nuevo')+' equipo</div>'+
    '<div class="sec-sub">El código se asigna automáticamente por tipo. '+(editar?'Código: '+esc(e.codigo||''):'')+'</div>'+
    '<div class="field-sec"><h3>Identificación</h3>'+
    '<div class="grid3">'+
      '<div><label>Tipo de equipo <span class="req">*</span></label><select id="e_tipo" onchange="onTipoEquipo()">'+'<option value="">— Seleccione —</option>'+TIPOS.map(t=>'<option '+(e.tipo===t.nombre?'selected':'')+'>'+esc(t.nombre)+'</option>').join('')+'</select></div>'+
      '<div id="wrapOtro" style="'+(e.tipo==='Otros'?'':'display:none;')+'"><label>¿Cuál? <span class="req">*</span></label><input id="e_otro" value="'+esc(e.tipo_otro||'')+'"></div>'+
      '<div><label>Código</label><input readonly value="'+esc(e.codigo||'(se asigna al guardar)')+'"></div>'+
    '</div>'+
    '<div class="grid3" style="margin-top:10px;">'+
      '<div><label>Marca</label><input id="e_marca" value="'+esc(e.marca||'')+'"></div>'+
      '<div><label>Referencia</label><input id="e_ref" value="'+esc(e.referencia||'')+'"></div>'+
      '<div><label>N° de serie</label><input id="e_serie" value="'+esc(e.numero_serie||'')+'"></div>'+
      '<div><label>N° de etiqueta</label><input id="e_etiqueta" value="'+esc(e.numero_etiqueta||'')+'"></div>'+
      '<div><label>Capacidad máx.</label><input type="number" id="e_capval" value="'+(e.capacidad_valor||'')+'" placeholder="0"></div>'+

function onTipoEquipo(){ document.getElementById('wrapOtro').style.display=document.getElementById('e_tipo').value==='Otros'?'':'none'; }
function cargarFoto(input){
  const f=input.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=1000; let w=img.width,h=img.height;
      if(w>max||h>max){ if(w>h){ h=h*max/w; w=max; } else { w=w*max/h; h=max; } }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      fotoTmp=cv.toDataURL('image/jpeg',0.7);
      const p=document.getElementById('fotoPrev'); p.src=fotoTmp; p.style.display='';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(f);
}
async function guardarEquipo(id){
  const err=document.getElementById('eq_err'); err.textContent='';
  const tipo=document.getElementById('e_tipo').value;
  const otro=tipo==='Otros'?document.getElementById('e_otro').value.trim():'';
  if(!tipo){ err.textContent='Seleccione el tipo de equipo.'; return; }
  if(tipo==='Otros'&&!otro){ err.textContent='Indique cuál tipo de equipo.'; return; }
  const campos={
    tipo, tipo_otro:otro||null, foto:fotoTmp||null,
    marca:document.getElementById('e_marca').value.trim()||null,
    referencia:document.getElementById('e_ref').value.trim()||null,
    numero_serie:document.getElementById('e_serie').value.trim()||null,
    numero_etiqueta:document.getElementById('e_etiqueta').value.trim()||null,
    capacidad_valor:Number(document.getElementById('e_capval').value)||null,
    capacidad_unidad:document.getElementById('e_capuni').value,
    fecha_fabricacion:document.getElementById('e_ffab').value||null,
    fecha_compra:document.getElementById('e_fcom').value||null,
    responsable:document.getElementById('e_resp').value.trim()||null,
    cargo:document.getElementById('e_cargo').value.trim()||null,
    gestor:document.getElementById('e_gestor').value.trim()||null,
    caracteristicas:document.getElementById('e_carac').value.trim()||null,
    updated_at:new Date().toISOString()
  };
  try{
    if(id){
      await sb.from('alt_equipos').update(campos).eq('id',id);
    } else {
      const {data:cod,error:e1}=await sb.rpc('alt_siguiente_codigo',{p_prefijo:prefijoDe(tipo)});
      if(e1)throw e1;
      const {error:e2}=await sb.from('alt_equipos').insert(Object.assign({},campos,{codigo:cod,creado_por:usuario}));
      if(e2)throw e2;
    }
    cerrarModal(); await cargar();
  }catch(e){ err.textContent='Error: '+e.message; }
}
async function eliminarEquipo(id){
  if(!esAdmin){ alert('Solo el administrador.'); return; }
  const e=equipos.find(x=>x.id===id);
  if(!confirm('¿Eliminar el equipo '+(e.codigo||'')+'?\nSe borrará junto con sus inspecciones. Los demás equipos del mismo tipo se renumerarán sin huecos.')) return;
  const clave=prompt('Ingrese la clave de administrador (LPS-SIG):');
  if(clave!==CLAVE_ADMIN){ alert('Clave incorrecta. No se eliminó.'); return; }
  try{
    await sb.from('alt_equipos').delete().eq('id',id);
    // Renumerar el prefijo del tipo para mantener la numeración continua (sin huecos)
    const prefijo=prefijoDe(e.tipo);
    const {data:n}=await sb.rpc('alt_renumerar_prefijo',{p_prefijo:prefijo});
    await cargar();
    const s=document.getElementById('subT'); const o=s.textContent;
    s.textContent='✅ Equipo eliminado. Tipo '+prefijo+' renumerado ('+(n!=null?n:'?')+' equipos).';
    setTimeout(()=>s.textContent=o,2500);
  }catch(e){ alert('Error: '+e.message); }
}

function formInspeccion(equipoId){

    '<div class="grid2">'+
      '<div><label>Fecha <span class="req">*</span></label><input type="date" id="i_fecha" min="1990-01-01" max="2100-12-31" value="'+new Date().toISOString().slice(0,10)+'" onchange="calcProxima()"></div>'+
      '<div><label>Próxima inspección</label><input type="date" id="i_prox" min="1990-01-01" max="2100-12-31"></div>'+

function calcProxima(){
  const f=document.getElementById('i_fecha').value;
  const p=document.getElementById('i_prox');
  if(f&&p&&!p.value){ const d=new Date(f+'T00:00:00'); d.setFullYear(d.getFullYear()+1); p.value=d.toISOString().slice(0,10); }
}
async function guardarInspeccion(equipoId){
  const err=document.getElementById('i_err');
  const fecha=document.getElementById('i_fecha').value;
  const inspector=document.getElementById('i_inspector').value.trim();
  if(!fecha){ err.textContent='La fecha es obligatoria.'; return; }
  if(!inspector){ err.textContent='El nombre del inspector es obligatorio.'; return; }
  try{
    await sb.from('alt_inspecciones').insert({equipo_id:equipoId,fecha,proxima_inspeccion:document.getElementById('i_prox').value||null,inspector,empresa:document.getElementById('i_empresa').value.trim()||null,resultado:document.getElementById('i_res').value,observaciones:document.getElementById('i_obs').value.trim()||null});
    await cargar(); verEquipo(equipoId);
  }catch(e){ err.textContent='Error: '+e.message; }
}
async function eliminarInspeccion(id,equipoId){
  if(!esAdmin){ alert('Solo el administrador.'); return; }

  const clave=prompt('Clave de administrador (LPS-SIG):');
  if(clave!==CLAVE_ADMIN){ alert('Clave incorrecta.'); return; }
  try{ await sb.from('alt_inspecciones').delete().eq('id',id); await cargar(); verEquipo(equipoId); }catch(e){ alert('Error: '+e.message); }
}
