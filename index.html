<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración de Inventarios · LPS</title>
<style>
  :root{--navy:#0A2540;--blue:#1598FF;--blue-d:#0C6BC4;--green:#16A34A;--amber:#D97706;--danger:#DC2626;--slate:#5B6B7C;--line:#E2EBF3;--bg:#EEF1F6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--navy);}
  .hidden{display:none!important;}
  input,select,textarea{width:100%;border:0.5px solid #D0DBE7;border-radius:7px;padding:9px 10px;font-size:12.5px;color:var(--navy);font-family:inherit;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  input[readonly]{background:#F1F5F9;color:#5B6B7C;}
  label{font-size:10px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;}
  .req{color:var(--danger);}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-p{background:var(--blue);color:#fff;}.btn-navy{background:var(--navy);color:#fff;}.btn-green{background:var(--green);color:#fff;}
  .btn-g{background:#EEF3F8;color:#42505E;border:0.5px solid #D0DBE7;}
  .btn-sm{border:none;background:#EAF5FF;color:var(--blue-d);border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer;}
  .pill{padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:600;display:inline-block;}
  .pill-ok{background:#DCFCE7;color:#166534;}.pill-no{background:#FEE2E2;color:#991B1B;}.pill-warn{background:#FEF3C7;color:#92600A;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:8px;font-weight:600;color:var(--slate);border-bottom:1px solid #EEF3F8;font-size:10.5px;text-transform:uppercase;}
  td{padding:7px 8px;border-bottom:1px solid #F4F7FB;vertical-align:middle;}
  .card{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .topbar{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .logo{height:30px;background:#fff;border-radius:6px;padding:2px 5px;margin-right:10px;}
  .tabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;flex-wrap:wrap;}
  .tab{padding:13px 16px;font-size:13px;font-weight:600;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .wrap{max-width:1180px;margin:0 auto;padding:22px;}
  .sec-title{font-size:18px;font-weight:600;margin-bottom:3px;}
  .sec-sub{font-size:11.5px;color:var(--slate);margin-bottom:16px;}
  .field-sec{margin-bottom:14px;}.field-sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--blue-d);border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:10px;}
  .kpi{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:14px;border-left:4px solid var(--slate);}
  .kpi .n{font-size:24px;font-weight:700;}.kpi .t{font-size:10px;color:var(--slate);text-transform:uppercase;}
  .modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:14px;padding:22px;width:720px;max-width:96vw;max-height:92vh;overflow:auto;}
  a.codelink{color:var(--blue-d);font-weight:700;font-family:ui-monospace,monospace;cursor:pointer;text-decoration:none;}
  .bar-chart{display:flex;flex-direction:column;gap:6px;}
  .bar-row{display:flex;align-items:center;gap:8px;font-size:11px;}
  .bar-row .lbl{width:130px;text-align:right;color:var(--slate);}
  .bar-row .bar{height:16px;background:var(--blue);border-radius:3px;min-width:2px;}
  .bar-row .val{font-weight:600;}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;"><img id="logoTop" class="logo"><div><div style="font-size:15px;font-weight:600;">Administración de Inventarios</div><div style="font-size:10px;color:#7FA8D4;" id="barRol">Registro y control</div></div></div>
  <div style="display:flex;gap:8px;align-items:center;"><div id="adminBtn"></div></div>
</div>
<div class="tabs">
  <div class="tab active" data-t="registro" onclick="irA('registro')">＋ Registro</div>
  <div class="tab" data-t="historial" onclick="irA('historial')">Historial</div>
  <div class="tab" data-t="existencias" onclick="irA('existencias')">Existencias</div>

  <div class="tab" data-t="catalogo" onclick="irA('catalogo')" id="tabCatalogo" style="display:none;">Catálogo</div>
  <div class="tab" data-t="personal" onclick="irA('personal')" id="tabPersonal" style="display:none;">Personal</div>

<div class="wrap">

  <div id="v-dashboard" class="hidden"></div>

  <div id="v-personal" class="hidden"></div>
</div>

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function abrirModal(html,w){ document.getElementById('modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal" style="'+(w?'width:'+w+';':'')+'">'+html+'</div></div>'; }
function cerrarModal(){ document.getElementById('modalRoot').innerHTML=''; }
function fnum(n){ return (Number(n)||0).toLocaleString('es-CO'); }
function copiarLinkInv(){ const url=location.origin+location.pathname.replace(/[^/]*$/,'registro-inventario.html'); navigator.clipboard.writeText(url).then(()=>alert('🔗 Link público de registro copiado. Compártalo para registrar inventario sin entrar al sistema:\n'+url)); }

function irA(t){
  ['registro','historial','existencias','dashboard','catalogo','personal'].forEach(x=>document.getElementById('v-'+x).classList.toggle('hidden',x!==t));
  document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.t===t));
  if(t==='registro')RENDER.registro(); if(t==='historial')RENDER.historial(); if(t==='existencias')RENDER.existencias(); if(t==='dashboard')RENDER.dashboard(); if(t==='catalogo')RENDER.catalogo(); if(t==='personal')RENDER.personal();
}

// ===== Admin =====
function pintarAdminBtn(){
  document.getElementById('adminBtn').innerHTML=esAdmin
    ? '<span class="pill pill-ok" style="margin-right:6px;">🔓 Admin</span><button class="btn-sm" onclick="bloquearAdmin()">Bloquear</button>'
    : '<button class="btn-sm" onclick="pedirAdmin()">🔒 Administrador</button>';
  document.getElementById('tabCatalogo').style.display=esAdmin?'':'none'; document.getElementById('tabPersonal').style.display=esAdmin?'':'none';
}
function pedirAdmin(){
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:10px;">Modo administrador</div><div class="sec-sub">Dashboard, existencias y catálogo. Clave de Gestión de Compras.</div>'+
    '<label>Su nombre</label><input id="ad_nom" value="'+esc(usuario==='Usuario'?'':usuario)+'"><div style="height:8px;"></div><label>Clave</label><input type="password" id="ad_clave" onkeydown="if(event.key===\'Enter\')validarAdmin()">'+
    '<div id="adErr" style="color:var(--danger);font-size:11px;margin-top:8px;"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-p" onclick="validarAdmin()">Desbloquear</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div>');
}
function validarAdmin(){ if(document.getElementById('ad_clave').value!==CLAVE_ADMIN){ document.getElementById('adErr').textContent='Clave incorrecta.'; return; } esAdmin=true; const n=document.getElementById('ad_nom').value.trim(); if(n)usuario=n; cerrarModal(); pintarAdminBtn(); }
function bloquearAdmin(){ esAdmin=false; pintarAdminBtn(); irA('registro'); }

// ===== Carga =====
async function cargar(){
  document.getElementById('logoTop').src=LOGO_LPS;
  const {data:cat}=await sb.from('inv_catalogo').select('*').eq('activo',true).order('codigo');
  catalogo=cat||[];
  pintarAdminBtn(); RENDER.registro();
}
const RENDER={};

// ===== REGISTRO =====
let regUsuario=null, regItems=[], regDesmontes=[];
RENDER.registro=function(){
  const c=document.getElementById('v-registro');
  c.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"><div><div class="sec-title">Nuevo registro de inventario</div><div class="sec-sub">La fecha y hora se registran automáticamente al guardar.</div></div><button class="btn btn-g" onclick="copiarLinkInv()">🔗 Link público de registro</button></div>'+
    '<div class="card"><div class="field-sec"><h3>Identificación</h3><div class="grid3">'+
      '<div style="grid-column:1/3;"><label>Cédula del usuario <span class="req">*</span></label><div style="display:flex;gap:6px;"><input id="r_ced" placeholder="Número de cédula" onkeydown="if(event.key===\'Enter\')buscarUsuario()"><button class="btn-sm" onclick="buscarUsuario()">🔍 Buscar</button></div></div>'+
      '<div><label>OT (Orden de trabajo) <span class="req">*</span></label><input id="r_ot" inputmode="numeric" placeholder="Solo números" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')"></div>'+
    '</div><div id="r_usuinfo" style="font-size:13px;font-weight:600;margin-top:8px;"></div></div>'+
    '<div class="card"><div class="field-sec"><h3>Elementos instalados</h3>'+
      '<div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;"><input id="r_serialman" placeholder="Buscar por serie / últimos 8 dígitos" style="max-width:280px;" onkeydown="if(event.key===\'Enter\')buscarSerialManual()"><button class="btn btn-p" onclick="buscarSerialManual()">🔍 Buscar</button></div>'+
      '<div id="itemsList"></div>'+
      '<button class="btn-sm" style="margin-top:8px;" onclick="addItem()">＋ Agregar elemento</button></div></div>'+
    '<div class="card"><div class="field-sec"><h3>Desmonte</h3>'+
      '<label>¿Aplica desmonte?</label><div style="display:flex;gap:10px;margin-bottom:8px;"><label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;"><input type="radio" name="r_desm" value="no" checked onchange="toggleDesmonte()" style="width:auto;"> No</label><label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;"><input type="radio" name="r_desm" value="si" onchange="toggleDesmonte()" style="width:auto;"> Sí</label></div>'+
      '<div id="desmonteWrap" style="display:none;"><div id="desmList"></div><button class="btn-sm" style="margin-top:8px;" onclick="addDesmonte()">＋ Agregar desmonte</button></div></div></div>'+
    '<div class="card"><label>Observaciones</label><textarea id="r_obs" rows="2"></textarea></div>'+
    '<div id="r_err" style="color:var(--danger);font-size:12px;margin-bottom:8px;"></div>'+
    '<div style="display:flex;gap:8px;margin-bottom:30px;"><button class="btn btn-green" onclick="guardarRegistro()">💾 Guardar registro</button><button class="btn btn-g" onclick="limpiarRegistro()">Limpiar</button></div>';
  regItems=[{codigo:'',descripcion:'',cantidad:1}]; regDesmontes=[];
  renderItems(); renderDesm();
};
async function buscarUsuario(){
  const ced=(document.getElementById('r_ced').value||'').trim();
  if(!ced){ alert('Escriba la cédula'); return; }
  const {data}=await sb.from('inv_personal').select('cedula,nombre,cargo').eq('cedula',ced).limit(1);
  const info=document.getElementById('r_usuinfo');
  if(!data||!data[0]){ regUsuario=null; info.innerHTML='<span style="color:var(--danger);">⛔ Cédula no encontrada en la base de personal. No se puede continuar.</span>'; return; }
  regUsuario={cedula:data[0].cedula,nombre:(data[0].nombre||'').trim(),cargo:data[0].cargo||''};
  info.innerHTML='<span style="color:var(--green);">✅ '+esc(regUsuario.nombre)+' — CC '+esc(regUsuario.cedula)+'</span>';
}
function addItem(){ regItems.push({codigo:'',descripcion:'',cantidad:1}); renderItems(); }
function delItem(i){ regItems.splice(i,1); renderItems(); }
function setItem(i,campo,val){ regItems[i][campo]=val; if(campo==='codigo'){ const c=catalogo.find(x=>x.codigo===val); regItems[i].descripcion=c?c.descripcion:''; regItems[i].sku=c?(c.sku||''):''; regItems[i].serial=c?(c.serial||''):''; renderItems(); } }
function renderItems(){
  const el=document.getElementById('itemsList'); if(!el)return;
  el.innerHTML='<div style="overflow-x:auto;"><table><thead><tr><th>Producto</th><th>SKU</th><th>Serie</th><th style="width:90px;">Cantidad</th><th></th></tr></thead><tbody>'+
    (regItems.length?regItems.map((it,i)=>'<tr>'+
      '<td><select onchange="setItem('+i+',\'codigo\',this.value)"><option value="">— Seleccione —</option>'+catalogo.map(c=>'<option value="'+esc(c.codigo)+'" '+(it.codigo===c.codigo?'selected':'')+'>'+esc(c.descripcion)+'</option>').join('')+'</select></td>'+
      '<td style="font-size:11px;color:var(--slate);font-family:ui-monospace,monospace;">'+esc(it.sku||'—')+'</td>'+
      '<td style="font-size:11px;color:var(--slate);font-family:ui-monospace,monospace;">'+esc(it.serial||'—')+'</td>'+
      '<td><input type="number" min="1" value="'+(it.cantidad||1)+'" onchange="setItem('+i+',\'cantidad\',Number(this.value))"></td>'+
      '<td><button class="btn-sm" style="background:#FEE2E2;color:#991B1B;" onclick="delItem('+i+')">✕</button></td></tr>').join(''):'<tr><td colspan="5" style="text-align:center;color:var(--slate);">Agregue productos</td></tr>')+
    '</tbody></table></div>';
}
function toggleDesmonte(){ const si=document.querySelector('input[name="r_desm"]:checked').value==='si'; document.getElementById('desmonteWrap').style.display=si?'':'none'; if(si&&!regDesmontes.length){ regDesmontes=[{serial:'',nota:'',cantidad:1}]; renderDesm(); } }
function addDesmonte(){ regDesmontes.push({serial:'',nota:'',cantidad:1}); renderDesm(); }
function delDesmonte(i){ regDesmontes.splice(i,1); renderDesm(); }
function setDesm(i,campo,val){ regDesmontes[i][campo]=val; }
function escanearDesmonte(i){ abrirCamara((texto)=>{ regDesmontes[i].serial=texto; logSerial(texto,'camara','busqueda',null); renderDesm(); }); }
function renderDesm(){
  const el=document.getElementById('desmList'); if(!el)return;
  el.innerHTML='<div style="font-size:11px;color:var(--slate);margin-bottom:6px;">En desmonte solo se guarda el serial (no consulta la base). Puede escanear o escribir manualmente.</div>'+
    '<div style="overflow-x:auto;"><table><thead><tr><th>Serie</th><th>Nota / producto</th><th style="width:80px;">Cant.</th><th></th></tr></thead><tbody>'+
    (regDesmontes.length?regDesmontes.map((it,i)=>'<tr>'+
      '<td><div style="display:flex;gap:4px;"><input value="'+esc(it.serial||'')+'" onchange="setDesm('+i+',\'serial\',this.value)" placeholder="Serial"><button class="btn-sm" onclick="escanearDesmonte('+i+')">📷</button></div></td>'+
      '<td><input value="'+esc(it.nota||'')+'" onchange="setDesm('+i+',\'nota\',this.value)" placeholder="Nota o producto (manual)"></td>'+
      '<td><input type="number" min="1" value="'+(it.cantidad||1)+'" onchange="setDesm('+i+',\'cantidad\',Number(this.value))"></td>'+
      '<td><button class="btn-sm" style="background:#FEE2E2;color:#991B1B;" onclick="delDesmonte('+i+')">✕</button></td></tr>').join(''):'<tr><td colspan="4" style="text-align:center;color:var(--slate);">Agregue seriales desmontados</td></tr>')+
    '</tbody></table></div>';
}
function limpiarRegistro(){ RENDER.registro(); }

async function guardarRegistro(){
  const err=document.getElementById('r_err'); err.textContent='';
  if(!regUsuario){ err.textContent='Busque y valide la cédula del usuario.'; return; }
  const ot=(document.getElementById('r_ot').value||'').trim();
  if(!ot){ err.textContent='La OT es obligatoria.'; return; }
  if(!/^[0-9]+$/.test(ot)){ err.textContent='La OT solo permite números.'; return; }
  const its=regItems.filter(it=>it.codigo);
  if(!its.length){ err.textContent='Agregue al menos un producto.'; return; }
  for(const it of its){ if(!(Number(it.cantidad)>0)){ err.textContent='Todas las cantidades deben ser mayores que cero.'; return; } }
  const aplicaDesm=document.querySelector('input[name="r_desm"]:checked').value==='si';
  let desm=[];
  if(aplicaDesm){ desm=regDesmontes.filter(it=>(it.serial&&it.serial.trim())||(it.nota&&it.nota.trim())); if(!desm.length){ err.textContent='Marcó desmonte SÍ: agregue al menos un serial o nota.'; return; } for(const it of desm){ if(!(Number(it.cantidad)>0)){ err.textContent='Las cantidades de desmonte deben ser mayores que cero.'; return; } } }
  try{
    const {data:cod,error:e0}=await sb.rpc('inv_siguiente'); if(e0)throw e0;

function limpiarHistFiltros(){ ['h_fd','h_fh','h_persona','h_ot','h_cod','h_desm'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';}); pintarHist(); }
function filtrarHist(){
  const fd=document.getElementById('h_fd').value, fh=document.getElementById('h_fh').value;
  const per=(document.getElementById('h_persona').value||'').toLowerCase(), ot=document.getElementById('h_ot').value;
  const cod=document.getElementById('h_cod').value, desm=document.getElementById('h_desm').value;
  const itemsByMov={}; (window._histItems||[]).forEach(it=>{ (itemsByMov[it.movimiento_id]=itemsByMov[it.movimiento_id]||[]).push(it); });
  return _histData.filter(r=>{
    const f=(r.fecha_registro||'').slice(0,10);
    if(fd&&f<fd) return false;
    if(fh&&f>fh) return false;
    if(per&&!((r.cedula||'').toLowerCase().includes(per)||(r.usuario_nombre||'').toLowerCase().includes(per))) return false;
    if(ot&&(r.ot||'')!==ot) return false;
    if(desm==='si'&&!r.aplica_desmonte) return false;
    if(desm==='no'&&r.aplica_desmonte) return false;
    if(cod){ const its=itemsByMov[r.id]||[]; if(!its.some(x=>x.codigo===cod)) return false; }
    return true;
  }).map(r=>({...r,_items:itemsByMov[r.id]||[]}));
}
function pintarHist(){
  const rows=filtrarHist();
  document.getElementById('histBody').innerHTML=rows.length?rows.map(r=>{
    const ent=r._items.filter(x=>x.tipo==='entrega').length;
    return '<tr><td><a class="codelink" onclick="verRegistro(\''+r.id+'\')">'+esc(r.consecutivo||'')+'</a></td>'+
      '<td style="font-size:11px;">'+new Date(r.fecha_registro).toLocaleString('es-CO')+'</td>'+
      '<td>'+esc(r.cedula||'')+'</td><td>'+esc(r.usuario_nombre||'')+'</td><td>'+esc(r.ot||'')+'</td>'+
      '<td>'+ent+' ítem(s)</td><td>'+(r.aplica_desmonte?'<span class="pill pill-warn">Sí</span>':'<span class="pill" style="background:#EEF3F8;color:#5B6B7C;">No</span>')+'</td>'+
      '<td style="white-space:nowrap;"><button class="btn-sm" onclick="verRegistro(\''+r.id+'\')">👁</button> <button class="btn-sm" style="background:#EDE9FE;color:#6D28D9;" onclick="pdfRegistroPorId(\''+r.id+'\')">📄</button></td></tr>';

async function guardarCatalogo(id){
  const desc=document.getElementById('cat_desc').value.trim();
  const sku=document.getElementById('cat_sku').value.trim()||null;
  const serial=document.getElementById('cat_serial').value.trim()||null;
  if(!desc){ document.getElementById('cat_err').textContent='El producto es obligatorio.'; return; }
  try{
    if(id){ await sb.from('inv_catalogo').update({descripcion:desc,sku,serial}).eq('id',id); }
    else {
      const cod='CAT-'+Date.now().toString(36).toUpperCase();
      await sb.from('inv_catalogo').insert({codigo:cod,descripcion:desc,sku,serial});
    }
    cerrarModal(); const {data:cat}=await sb.from('inv_catalogo').select('*').eq('activo',true).order('descripcion'); catalogo=cat||[]; RENDER.catalogo();
  }catch(e){ document.getElementById('cat_err').textContent='Error: '+e.message; }
}
async function delCatalogo(id){ if(!confirm('¿Eliminar este elemento del catálogo?')) return; try{ await sb.from('inv_catalogo').update({activo:false}).eq('id',id); const {data:cat}=await sb.from('inv_catalogo').select('*').eq('activo',true).order('codigo'); catalogo=cat||[]; RENDER.catalogo(); }catch(e){ alert('Error: '+e.message); } }
function importarCatExcel(){
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:8px;">Importar catálogo desde Excel</div>'+
    '<div class="sec-sub">Columnas: <b>producto</b> (o descripcion), y opcionalmente <b>sku</b> y <b>serial</b> (primera fila = encabezados).</div>'+
    '<input type="file" id="catFile" accept=".xlsx,.xls,.csv"><div id="impErr" style="color:var(--danger);font-size:11px;margin-top:8px;"></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-p" onclick="procesarCatExcel()">Importar</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div>');
}
async function procesarCatExcel(){
  const f=document.getElementById('catFile').files[0]; if(!f){ document.getElementById('impErr').textContent='Seleccione un archivo.'; return; }
  try{
    const buf=await f.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    const items=rows.map(r=>{ const k={}; Object.keys(r).forEach(kk=>k[kk.toString().toLowerCase().trim()]=r[kk]); const desc=String(k.producto||k.descripcion||k['descripción']||'').trim(); return desc?{codigo:'CAT-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),descripcion:desc,sku:String(k.sku||'').trim()||null,serial:String(k.serial||k.serie||'').trim()||null}:null; }).filter(Boolean);
    if(!items.length){ document.getElementById('impErr').textContent='No se encontraron descripciones (revise la columna descripcion).'; return; }
    const {error}=await sb.from('inv_catalogo').insert(items); if(error)throw error;
    cerrarModal(); const {data:cat}=await sb.from('inv_catalogo').select('*').eq('activo',true).order('descripcion'); catalogo=cat||[]; RENDER.catalogo();
    alert('✅ '+items.length+' descripción(es) importadas.');
  }catch(e){ document.getElementById('impErr').textContent='Error: '+e.message; }
}

function exportarExcel(){
  const rows=filtrarHist();
  if(!rows.length){ alert('No hay registros para exportar con los filtros actuales.'); return; }
  const filas=[];
  rows.forEach(r=>{ r._items.forEach(it=>{ filas.push({Registro:r.consecutivo,Fecha:new Date(r.fecha_registro).toLocaleDateString('es-CO'),Hora:new Date(r.fecha_registro).toLocaleTimeString('es-CO'),Cedula:r.cedula,Nombre:r.usuario_nombre,OT:r.ot,Tipo:it.tipo==='desmonte'?'Desmonte (instalado)':'Instalado',SKU:it.sku||'',Serial:it.serial||'',Producto:it.descripcion,Cantidad:it.cantidad}); }); });
  const ws=XLSX.utils.json_to_sheet(filas); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Inventario');
  XLSX.writeFile(wb,'inventario_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

    '<table style="width:100%;font-size:11px;margin-top:10px;"><tr><td style="padding:3px;"><b>Cédula:</b> '+esc(r.cedula||'')+'</td><td style="padding:3px;"><b>Usuario:</b> '+esc(r.usuario_nombre||'')+'</td><td style="padding:3px;"><b>OT:</b> '+esc(r.ot||'')+'</td></tr></table>'+
    '<div style="font-weight:bold;margin-top:12px;font-size:11px;">ELEMENTOS INSTALADOS</div>'+tablaInst(ent)+
    (des.length?'<div style="font-weight:bold;margin-top:12px;font-size:11px;">ELEMENTOS DESMONTADOS</div>'+tablaDesm(des):'')+
    (r.observaciones?'<div style="font-size:10px;margin-top:10px;"><b>Observaciones:</b> '+esc(r.observaciones)+'</div>':'')+
    '<div style="font-size:9px;color:#5B6B7C;margin-top:16px;border-top:1px solid #ccc;padding-top:6px;">LPS Grupo · Administración de Inventarios · Generado: '+new Date().toLocaleString('es-CO')+'</div></div>';
  const w=window.open('','_blank');
  w.document.write('<html><head><title>'+esc(r.consecutivo||'Registro')+'</title></head><body>'+html+'<scr'+'ipt>window.onload=function(){window.print();}</scr'+'ipt></body></html>');
  w.document.close();
}

// ===== PERSONAL (base propia del inventario) =====
RENDER.personal=async function(){
  const c=document.getElementById('v-personal');
  const {data}=await sb.from('inv_personal').select('*').eq('activo',true).order('nombre');
  const per=data||[];
  c.innerHTML='<div class="sec-title">Personal (base del inventario)</div><div class="sec-sub">'+per.length+' persona(s) · esta es la base propia; el registro valida cédulas aquí</div>'+
    '<div style="display:flex;justify-content:flex-end;margin-bottom:8px;gap:8px;"><button class="btn btn-g" onclick="importarPersonalExcel()">⬆ Importar Excel</button><button class="btn btn-p" onclick="formPersonal()">＋ Nueva persona</button></div>'+
    '<div class="card" style="padding:6px 14px 14px;overflow-x:auto;"><table><thead><tr><th>Cédula</th><th>Nombre</th><th>Cargo</th><th></th></tr></thead><tbody>'+
    (per.length?per.map(p=>'<tr><td style="font-family:ui-monospace,monospace;">'+esc(p.cedula)+'</td><td>'+esc(p.nombre)+'</td><td>'+esc(p.cargo||'—')+'</td><td style="white-space:nowrap;text-align:right;"><button class="btn-sm" onclick="formPersonal(\''+p.id+'\')">✏️</button> <button class="btn-sm" style="background:#FEE2E2;color:#991B1B;" onclick="delPersonal(\''+p.id+'\')">🗑</button></td></tr>').join(''):'<tr><td colspan="4" style="text-align:center;color:var(--slate);padding:20px;">Sin personal. Agregue o importe desde Excel.</td></tr>')+
    '</tbody></table></div>';
};
async function formPersonal(id){
  let e={};
  if(id){ const {data}=await sb.from('inv_personal').select('*').eq('id',id).limit(1); e=data[0]||{}; }
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:10px;">'+(id?'Editar':'Nueva')+' persona</div>'+
    '<div><label>Cédula <span class="req">*</span></label><input id="per_ced" value="'+esc(e.cedula||'')+'" '+(id?'readonly':'')+'></div>'+
    '<div style="margin-top:8px;"><label>Nombre <span class="req">*</span></label><input id="per_nom" value="'+esc(e.nombre||'')+'"></div>'+
    '<div style="margin-top:8px;"><label>Cargo</label><input id="per_cargo" value="'+esc(e.cargo||'')+'"></div>'+
    '<div id="per_err" style="color:var(--danger);font-size:11px;margin-top:8px;"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-p" onclick="guardarPersonal('+(id?"'"+id+"'":'null')+')">💾 Guardar</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div>');
}
async function guardarPersonal(id){
  const ced=document.getElementById('per_ced').value.trim(), nom=document.getElementById('per_nom').value.trim();
  if(!ced||!nom){ document.getElementById('per_err').textContent='Cédula y nombre son obligatorios.'; return; }
  const row={cedula:ced,nombre:nom,cargo:document.getElementById('per_cargo').value.trim()||null};
  try{ if(id) await sb.from('inv_personal').update({nombre:row.nombre,cargo:row.cargo}).eq('id',id); else await sb.from('inv_personal').insert(row); cerrarModal(); RENDER.personal();
  }catch(e){ document.getElementById('per_err').textContent='Error: '+e.message+(e.message.includes('duplicate')?' (cédula ya existe)':''); }
}
async function delPersonal(id){ if(!confirm('¿Eliminar esta persona?')) return; try{ await sb.from('inv_personal').update({activo:false}).eq('id',id); RENDER.personal(); }catch(e){ alert('Error: '+e.message); } }
function importarPersonalExcel(){
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:8px;">Importar personal desde Excel</div>'+
    '<div class="sec-sub">Columnas: <b>cedula</b>, <b>nombre</b> y opcionalmente <b>cargo</b> (primera fila = encabezados).</div>'+
    '<input type="file" id="perFile" accept=".xlsx,.xls,.csv"><div id="perImpErr" style="color:var(--danger);font-size:11px;margin-top:8px;"></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-p" onclick="procesarPersonalExcel()">Importar</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div>');
}
async function procesarPersonalExcel(){
  const f=document.getElementById('perFile').files[0]; if(!f){ document.getElementById('perImpErr').textContent='Seleccione un archivo.'; return; }
  try{
    const buf=await f.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    const items=rows.map(r=>{ const k={}; Object.keys(r).forEach(kk=>k[kk.toString().toLowerCase().trim()]=r[kk]); return {cedula:String(k.cedula||k['cédula']||'').trim(),nombre:String(k.nombre||'').trim(),cargo:String(k.cargo||'').trim()||null}; }).filter(x=>x.cedula&&x.nombre);
    if(!items.length){ document.getElementById('perImpErr').textContent='No se encontraron filas válidas (revise columnas cedula y nombre).'; return; }
    const {error}=await sb.from('inv_personal').upsert(items,{onConflict:'cedula'}); if(error)throw error;
    cerrarModal(); RENDER.personal(); alert('✅ '+items.length+' persona(s) importadas/actualizadas.');
  }catch(e){ document.getElementById('perImpErr').textContent='Error: '+e.message; }
}

// ===== ESCÁNER DE SERIAL POR CÁMARA =====
let _scanner=null;
function buscarSerialEnCatalogo(serial){
  const s=String(serial||'').trim();
  const u8=s.slice(-8);
  // Coincidencia por serial completo O por últimos 8 dígitos
  return catalogo.find(c=>{ const cs=String(c.serial||'').trim(); if(!cs)return false; return cs===s || cs.slice(-8)===u8 || cs===u8; });
}
async function logSerial(serial,metodo,accion,encontrado){
  try{ await sb.from('inv_serial_log').insert({serial:serial,metodo:metodo,accion:accion,encontrado:encontrado,usuario:usuario}); }catch(e){}
}
// Abre la cámara en un modal; al leer, ejecuta callback(texto, 'camara')
function abrirCamara(callback){
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:8px;">📷 Escanear código</div>'+
    '<div class="sec-sub">Alinee el código de barras/QR dentro del recuadro.</div>'+
    '<div id="scanBox" style="width:100%;max-width:400px;margin:0 auto;"></div>'+
    '<div id="scanEstado" style="font-size:11px;color:var(--slate);text-align:center;margin-top:6px;"></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;justify-content:center;"><button class="btn btn-g" onclick="cerrarCamara()">Cerrar cámara</button></div>');
  const est=document.getElementById('scanEstado'); est.textContent='Iniciando cámara…';
  if(typeof Html5Qrcode==='undefined'){ est.innerHTML='<span style="color:var(--danger);">No se pudo cargar el lector. Verifique su conexión.</span>'; return; }
  _scanner=new Html5Qrcode('scanBox');
  _scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:150}},
    (texto)=>{ est.textContent='✅ Leído: '+texto; cerrarCamara(); callback(texto,'camara'); },
    ()=>{}
  ).then(()=>{ est.textContent='Cámara activa. Enfoque el código.'; })
   .catch(err=>{ est.innerHTML='<span style="color:var(--danger);">No se pudo abrir la cámara: '+esc(err)+'<br>Puede ingresar el serial manualmente.</span>'; });
}
function cerrarCamara(){ if(_scanner){ try{ _scanner.stop().then(()=>{ _scanner.clear(); _scanner=null; }); }catch(e){ _scanner=null; } } cerrarModal(); }

// Escanear para llenar un campo (ej. serial del catálogo)
function escanearSerialCampo(inputId){
  abrirCamara((texto)=>{ const el=document.getElementById(inputId); if(el)el.value=texto; logSerial(texto,'camara','busqueda',null); });
}

// Escanear serial en el registro: busca; si existe lo agrega; si no, ofrece registrar/manual
function escanearSerialRegistro(){
  abrirCamara((texto,metodo)=>{ procesarSerial(texto,metodo||'camara'); });
}
function procesarSerial(serial,metodo){
  const s=String(serial||'').trim();
  if(!s){ return; }
  const encontrado=buscarSerialEnCatalogo(s);
  logSerial(s,metodo,'busqueda',!!encontrado);
  if(encontrado){
    // Agregar el elemento encontrado al registro
    const vacio=regItems.findIndex(it=>!it.codigo);
    if(vacio>=0){ regItems[vacio]={codigo:encontrado.codigo,descripcion:encontrado.descripcion,sku:encontrado.sku||'',serial:encontrado.serial||s,cantidad:1}; }
    else { regItems.push({codigo:encontrado.codigo,descripcion:encontrado.descripcion,sku:encontrado.sku||'',serial:encontrado.serial||s,cantidad:1}); }
    renderItems();
    // Limpiar la casilla de búsqueda para una nueva consulta
    const inp=document.getElementById('r_serialman'); if(inp){ inp.value=''; inp.focus(); }
    abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:6px;color:var(--green);">✅ Equipo encontrado</div>'+
      '<div style="font-size:13px;"><b>Serie:</b> '+esc(s)+'<br><b>SKU:</b> '+esc(encontrado.sku||'—')+'<br><b>Producto:</b> '+esc(encontrado.descripcion)+'</div>'+
      '<div class="sec-sub" style="margin-top:6px;">Se agregó al registro. La casilla quedó lista para una nueva búsqueda.</div>'+
      '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-p" onclick="cerrarModal();document.getElementById(\'r_serialman\').focus();">🔍 Nueva búsqueda</button><button class="btn btn-g" onclick="cerrarModal()">Cerrar</button></div>');
  } else {
    // No encontrado: ofrecer registrar o corregir manualmente
    abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:6px;color:var(--amber);">⚠ Equipo no encontrado</div>'+
      '<div style="font-size:13px;">Serie: <b>'+esc(s)+'</b></div>'+
      '<div class="sec-sub" style="margin-top:6px;">Puede registrarlo como nuevo producto del catálogo, o corregir el número.</div>'+
      '<div style="margin-top:10px;"><label>Serie</label><input id="ser_manual" value="'+esc(s)+'"></div>'+
      '<div style="margin-top:8px;"><label>Producto <span class="req">*</span></label><input id="ser_desc" placeholder="Nombre del producto"></div>'+
      '<div id="ser_err" style="color:var(--danger);font-size:11px;margin-top:8px;"></div>'+
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;"><button class="btn btn-green" onclick="registrarSerialNuevo(\''+metodo+'\')">💾 Registrar y agregar</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div>');
  }
}
// Búsqueda manual por serial (últimos 8 dígitos o completo)
function buscarSerialManual(){
  const s=(document.getElementById('r_serialman')?document.getElementById('r_serialman').value:'').trim();
  if(!s){ alert('Escriba el serial o los últimos 8 dígitos'); return; }
  procesarSerial(s,'manual');
}
async function registrarSerialNuevo(metodo){
  const serial=document.getElementById('ser_manual').value.trim();
  const desc=document.getElementById('ser_desc').value.trim();
  const err=document.getElementById('ser_err');
  if(!desc){ err.textContent='La descripción es obligatoria.'; return; }
  if(serial && !/^[A-Za-z0-9\-]+$/.test(serial)){ err.textContent='El serial solo admite letras, números y guiones.'; return; }
  // Evitar duplicado exacto
  if(serial && catalogo.some(c=>String(c.serial||'').trim()===serial)){ err.textContent='Ese serial ya existe en el catálogo.'; return; }
  try{
    const cod='CAT-'+Date.now().toString(36).toUpperCase();
    const {data,error}=await sb.from('inv_catalogo').insert({codigo:cod,descripcion:desc,serial:serial||null}).select();
    if(error)throw error;
    await logSerial(serial,metodo||'manual','registro',false);
    // Refrescar catálogo y agregar al registro
    const {data:cat}=await sb.from('inv_catalogo').select('*').eq('activo',true).order('descripcion'); catalogo=cat||[];
    const nuevo=data[0];
    const vacio=regItems.findIndex(it=>!it.codigo);
    if(vacio>=0){ regItems[vacio]={codigo:nuevo.codigo,descripcion:nuevo.descripcion,cantidad:1}; }
    else { regItems.push({codigo:nuevo.codigo,descripcion:nuevo.descripcion,cantidad:1}); }
    renderItems();
    cerrarModal();
  }catch(e){ err.textContent='Error: '+e.message; }
}
