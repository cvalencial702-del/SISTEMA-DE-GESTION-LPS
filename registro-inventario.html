<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Inventario · LPS</title>
<style>
  :root{--navy:#0A2540;--blue:#1598FF;--blue-d:#0C6BC4;--green:#16A34A;--amber:#D97706;--danger:#DC2626;--slate:#5B6B7C;--line:#E2EBF3;--bg:#EEF1F6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--navy);}
  input,select,textarea{width:100%;border:0.5px solid #D0DBE7;border-radius:7px;padding:9px 10px;font-size:12.5px;color:var(--navy);font-family:inherit;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  label{font-size:10px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;}
  .req{color:var(--danger);}
  .btn{border:none;border-radius:8px;padding:11px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-p{background:var(--blue);color:#fff;}.btn-green{background:var(--green);color:#fff;}
  .btn-g{background:#EEF3F8;color:#42505E;border:0.5px solid #D0DBE7;}
  .btn-sm{border:none;background:#EAF5FF;color:var(--blue-d);border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer;}
  .card{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px;}
  .bar{background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:10px 14px;border-radius:8px 8px 0 0;margin:-18px -18px 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px;}
  .topbar{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:10px;}
  .topbar .logo{height:30px;background:#fff;border-radius:6px;padding:2px 5px;}
  .wrap{max-width:820px;margin:0 auto;padding:22px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:6px;color:var(--slate);font-size:9.5px;text-transform:uppercase;}
  td{padding:5px 6px;}
  .msg{padding:16px;border-radius:10px;font-size:13px;text-align:center;}
  .msg.ok{background:#DCFCE7;color:#166534;}.msg.err{background:#FEE2E2;color:#991B1B;}
</style>
</head>
<body>
<div class="topbar"><img id="logoTop" class="logo"><div><div style="font-size:15px;font-weight:600;">Registro de Inventario</div><div style="font-size:10px;color:#7FA8D4;">Registro público · LPS Grupo</div></div></div>
<div class="wrap">
  <div class="card">
    <div class="bar">🔍 IDENTIFICACIÓN</div>
    <div class="grid3">
      <div style="grid-column:1/3;"><label>Cédula del usuario <span class="req">*</span></label><div style="display:flex;gap:6px;"><input id="ced" placeholder="Número de cédula" onkeydown="if(event.key==='Enter')buscar()"><button class="btn-sm" onclick="buscar()">🔍</button></div></div>
      <div><label>OT (Orden de trabajo) <span class="req">*</span></label><input id="ot" inputmode="numeric" placeholder="Solo números" oninput="this.value=this.value.replace(/[^0-9]/g,'')"></div>
    </div>
    <div id="usuInfo" style="font-size:13px;font-weight:600;margin-top:8px;"></div>
  </div>

  <div id="formReg" style="display:none;">
    <div class="card">
      <div class="bar">📦 ELEMENTOS ENTREGADOS</div>
      <div id="itemsList"></div>
      <button class="btn-sm" style="margin-top:8px;" onclick="addItem()">＋ Agregar elemento</button>
    </div>
    <div class="card">
      <div class="bar">🔧 DESMONTE</div>
      <label>¿Aplica desmonte?</label>
      <div style="display:flex;gap:10px;margin-bottom:8px;"><label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;"><input type="radio" name="desm" value="no" checked onchange="toggleDesm()" style="width:auto;"> No</label><label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;"><input type="radio" name="desm" value="si" onchange="toggleDesm()" style="width:auto;"> Sí</label></div>
      <div id="desmWrap" style="display:none;"><div id="desmList"></div><button class="btn-sm" style="margin-top:8px;" onclick="addDesm()">＋ Agregar desmonte</button></div>
    </div>
    <div class="card"><label>Observaciones</label><textarea id="obs" rows="2"></textarea></div>
    <div id="err" style="color:var(--danger);font-size:12px;margin-bottom:8px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:30px;"><button class="btn btn-green" id="btnG" onclick="guardar()">💾 Guardar registro</button><button class="btn btn-g" onclick="reiniciar()">Cancelar</button></div>
  </div>
  <div id="resultado"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kssoegcjwngsnfwdvjne.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtzc29lZ2Nqd25nc25md2R2am5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjE3OTMsImV4cCI6MjA5OTAzNzc5M30.rtvKepiLyKEMkJPxTHw336E6UEoPyAkEX_5jU7WgGM4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const LOGO_LPS='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEEAAAAoCAYAAAChDJfXAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAARTSURBVGhD7ZltTJVlGMd/13OAA4UBSrBJaNPRMhWVOc2FOZnLMnKu2rK15UzZilxv9MnUrZq9aFlfWl9ac+U0k3Q4tZKpaWENBk1bDJFASYgQ5OUAh/P2XH24D6HHD22n5zSbz+/T2Tn3ue/r+T3X/T/3syOqqtzkWLFv3Iy4ElwJBleCK8HgSnAlGFwJrgSDK8GVYHAluBIMroR4JSjwx7DSMQROP4grcNmv+MOxnySO+CQovHISyo8rEQclqMJwEMqqhYqTMByKHZEY4pIA0BeA/lGwHZKgCi39sPqI0tANh9rgnTrFF4wd6TxxS4glbIM/DMEIDIWgN9rStpoWtxUCEegegc4hZSR0rUB/GDacgLM9whuLYMVUZWejsLXWzJlIHJFgKxz8TSmpNFtk8V6Yv1t4YD/sboKIDRcGlMcPwbKvlNIqePAAHG4bt/DdJWi8AmvvUZ6aAW8tFmZOUvacgzd/MgIThSMSiN7Jiz5ougLbFyv7SiHLq2w6DbVdsPccnL0MVSuFmieE6Zmwo0H+bve7s5SMFKg8D819yvcdSkuf4BH4tBE+aFBCduyqzuCYBIBkCzYvFJZOEYpy4LUFELKhplNJT4Gwwvv1cKBFKS+Ej0ogLcl8d2qG8PZ9ylBIWPMNVJwS8icoux9S7s9TPj4jHG5VxzLoav6VhNh6kiyYlAYeARG4/RYBYCAAjxUIq6Yrv/YqW2uFddVK24CSFK3AI7A0X1h+p037kBC24fVFUJQjfLgEkiyluv36NZ0gbgkpFgwGhWBkPOBGw1DbZdo2bENdlyJAQaZwrN1mTray/xHhyCpIT4ZtdSYvACIKu5qUby9aTL5VCdqwqQZaB5Tnjwv+iLAkz8znNHFJEIGSfOgZhTVHlX3NxoICO+qhrFp56YSy+UcTbkungC8kbKu32NmofH1B8YWEolzBilZQ06G8Vy8UZitVK4XtxdA5IpRWCae74NnZ8GiBhZUAC/FJANbPEspmKf6wELZNZUkCW+4Vki2T9E/PMEF4RzqsnSlsmAOVzfDJL/DkXfBusZkLzPhABFYXKHnpsGwq5KcrgQg8V6hsXACeuKr9ZyTef6DGfvvHtsKX55SNp4XPlsP8XBgIKKlJRohHFEsEf1gZDgmZqeALwkQveKPB2OOH9dVwtgcqiuDY79DQDS/OhfK54PVcs7yjxC3hamyFPU1GwufLYTCoqMLP3cq0DMhOE7K8wsFWpSgXctKgYwj+HIEX5gki5sR4vh+eOQqtg5DqgVeLlLJCIzKRODr9WGtneYXeUUjxwMPTLHpH4UyPYiMMBiDDK/hCMCFl3L8IFGTCFytgxkRly0Jl3ezEC8CpTlCFUx3Kribh5Xkm6S/5lMJsYXL6+NH5hw4ozjN7O2ybDJGYoFNgMAC3ecelJhpHJBDdEhGNnhGiFyPR12OoXn/RNwKOSfg/8x/suBsfV4IrweBKcCUYXAmuBIMrAfgLhJ7NVYtfXl4AAAAASUVORK5CYII=';
let catalogo=[], usuario=null, items=[], desmontes=[];
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
document.getElementById('logoTop').src=LOGO_LPS;

async function init(){ const {data}=await sb.from('inv_catalogo').select('*').eq('activo',true).order('codigo'); catalogo=data||[]; }
init();

async function buscar(){
  const c=(document.getElementById('ced').value||'').trim();
  if(!c){ alert('Escriba la cédula'); return; }
  const {data}=await sb.from('empleados').select('cedula,nombres,apellidos').eq('cedula',c).limit(1);
  const info=document.getElementById('usuInfo');
  if(!data||!data[0]){ usuario=null; info.innerHTML='<span style="color:var(--danger);">⛔ Cédula no encontrada en la base de personal.</span>'; document.getElementById('formReg').style.display='none'; return; }
  usuario={cedula:data[0].cedula,nombre:((data[0].nombres||'')+' '+(data[0].apellidos||'')).trim()};
  info.innerHTML='<span style="color:var(--green);">✅ '+esc(usuario.nombre)+' — CC '+esc(usuario.cedula)+'</span>';
  document.getElementById('formReg').style.display='';
  items=[{codigo:'',descripcion:'',cantidad:1}]; desmontes=[]; renderItems(); renderDesm();
}
function addItem(){ items.push({codigo:'',descripcion:'',cantidad:1}); renderItems(); }
function delItem(i){ items.splice(i,1); renderItems(); }
function setItem(i,c,v){ items[i][c]=v; if(c==='codigo'){ const cc=catalogo.find(x=>x.codigo===v); items[i].descripcion=cc?cc.descripcion:''; renderItems(); } }
function optCat(sel){ return '<option value="">— Seleccione —</option>'+catalogo.map(c=>'<option value="'+esc(c.codigo)+'" '+(sel===c.codigo?'selected':'')+'>'+esc(c.descripcion)+'</option>').join(''); }
function renderItems(){
  document.getElementById('itemsList').innerHTML='<div style="overflow-x:auto;"><table><thead><tr><th>Elemento</th><th style="width:90px;">Cant.</th><th></th></tr></thead><tbody>'+
    (items.length?items.map((it,i)=>'<tr><td><select onchange="setItem('+i+',\'codigo\',this.value)">'+optCat(it.codigo)+'</select></td><td><input type="number" min="1" value="'+(it.cantidad||1)+'" onchange="setItem('+i+',\'cantidad\',Number(this.value))"></td><td><button class="btn-sm" style="background:#FEE2E2;color:#991B1B;" onclick="delItem('+i+')">✕</button></td></tr>').join(''):'<tr><td colspan="3" style="text-align:center;color:var(--slate);">Agregue elementos</td></tr>')+'</tbody></table></div>';
}
function toggleDesm(){ const si=document.querySelector('input[name="desm"]:checked').value==='si'; document.getElementById('desmWrap').style.display=si?'':'none'; if(si&&!desmontes.length){ desmontes=[{codigo:'',descripcion:'',cantidad:1}]; renderDesm(); } }
function addDesm(){ desmontes.push({codigo:'',descripcion:'',cantidad:1}); renderDesm(); }
function delDesm(i){ desmontes.splice(i,1); renderDesm(); }
function setDesm(i,c,v){ desmontes[i][c]=v; if(c==='codigo'){ const cc=catalogo.find(x=>x.codigo===v); desmontes[i].descripcion=cc?cc.descripcion:''; renderDesm(); } }
function renderDesm(){
  document.getElementById('desmList').innerHTML='<div style="overflow-x:auto;"><table><thead><tr><th>Elemento</th><th style="width:90px;">Cant.</th><th></th></tr></thead><tbody>'+
    (desmontes.length?desmontes.map((it,i)=>'<tr><td><select onchange="setDesm('+i+',\'codigo\',this.value)">'+optCat(it.codigo)+'</select></td><td><input type="number" min="1" value="'+(it.cantidad||1)+'" onchange="setDesm('+i+',\'cantidad\',Number(this.value))"></td><td><button class="btn-sm" style="background:#FEE2E2;color:#991B1B;" onclick="delDesm('+i+')">✕</button></td></tr>').join(''):'<tr><td colspan="3" style="text-align:center;color:var(--slate);">Agregue elementos desmontados</td></tr>')+'</tbody></table></div>';
}
async function guardar(){
  const err=document.getElementById('err'); err.textContent='';
  if(!usuario){ err.textContent='Busque y valide la cédula.'; return; }
  const ot=(document.getElementById('ot').value||'').trim();
  if(!ot){ err.textContent='La OT es obligatoria.'; return; }
  if(!/^[0-9]+$/.test(ot)){ err.textContent='La OT solo permite números.'; return; }
  const its=items.filter(it=>it.codigo);
  if(!its.length){ err.textContent='Agregue al menos un elemento.'; return; }
  for(const it of its){ if(!(Number(it.cantidad)>0)){ err.textContent='Las cantidades deben ser mayores que cero.'; return; } }
  const aplicaDesm=document.querySelector('input[name="desm"]:checked').value==='si';
  let desm=[];
  if(aplicaDesm){ desm=desmontes.filter(it=>it.codigo); if(!desm.length){ err.textContent='Marcó desmonte SÍ: agregue al menos un elemento.'; return; } for(const it of desm){ if(!(Number(it.cantidad)>0)){ err.textContent='Cantidades de desmonte deben ser mayores que cero.'; return; } } }
  const btn=document.getElementById('btnG'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    const {data:cod,error:e0}=await sb.rpc('inv_siguiente'); if(e0)throw e0;
    const {data:mov,error:e1}=await sb.from('inv_movimientos').insert({consecutivo:cod,cedula:usuario.cedula,usuario_nombre:usuario.nombre,ot,aplica_desmonte:aplicaDesm,observaciones:document.getElementById('obs').value.trim()||null,creado_por:'Público (link)'}).select();
    if(e1)throw e1;
    const movId=mov[0].id;
    const filas=its.map(it=>({movimiento_id:movId,tipo:'entrega',codigo:it.codigo,descripcion:it.descripcion,cantidad:Number(it.cantidad)}));
    if(aplicaDesm) desm.forEach(it=>filas.push({movimiento_id:movId,tipo:'desmonte',codigo:it.codigo,descripcion:it.descripcion,cantidad:Number(it.cantidad)}));
    const {error:e2}=await sb.from('inv_mov_items').insert(filas); if(e2)throw e2;
    document.getElementById('formReg').style.display='none';
    document.getElementById('resultado').innerHTML='<div class="msg ok">✅ Registro guardado como <b>'+esc(cod)+'</b>.<br>Fecha y hora registradas automáticamente. Gracias.</div><div style="text-align:center;margin-top:12px;"><button class="btn btn-p" onclick="location.reload()">Registrar otro</button></div>';
  }catch(e){ btn.disabled=false; btn.textContent='💾 Guardar registro'; err.textContent='Error: '+e.message; }
}
function reiniciar(){ document.getElementById('formReg').style.display='none'; usuario=null; document.getElementById('usuInfo').innerHTML=''; document.getElementById('ced').value=''; document.getElementById('ot').value=''; }
</script>
</body>
</html>
