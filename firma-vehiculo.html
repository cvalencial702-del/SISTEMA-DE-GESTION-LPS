<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de Verificación de Vehículo · LPS</title>
<style>
  :root{--navy:#0A2540;--blue:#1598FF;--green:#16A34A;--amber:#D97706;--danger:#DC2626;--slate:#5B6B7C;--line:#E2EBF3;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#EEF3F8;color:var(--navy);padding:16px;}
  .wrap{max-width:680px;margin:0 auto;}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(10,37,64,.08);overflow:hidden;margin-bottom:16px;}
  .hdr{background:var(--navy);color:#fff;padding:18px 20px;}.hdr h1{font-size:16px;}.hdr p{font-size:12px;color:#B0C9E4;margin-top:4px;}
  .body{padding:20px;}
  h2{font-size:12px;margin:14px 0 6px;color:#fff;padding:6px 10px;border-radius:6px;background:var(--blue);}
  .datos{font-size:13px;line-height:1.8;}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px;}
  th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
  th{background:#EAF5FF;font-size:11px;}
  .pill{padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;}
  .pill-ok{background:#DCFCE7;color:#166534;}.pill-warn{background:#FEF3C7;color:#92600A;}.pill-bad{background:#FEE2E2;color:#991B1B;}
  .fotos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .fotos img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line);}
  .els{columns:2;font-size:11.5px;line-height:1.8;}
  label{display:block;font-size:11px;font-weight:700;margin:14px 0 6px;}
  canvas{border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;touch-action:none;cursor:crosshair;}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-p{background:var(--green);color:#fff;}.btn-g{background:#EEF3F8;color:var(--slate);}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .msg{padding:14px;border-radius:10px;font-size:14px;text-align:center;}
  .ok{background:#DCFCE7;color:#166534;}.err{background:#FEE2E2;color:#991B1B;}
  .res{padding:10px 14px;border-radius:8px;font-weight:700;font-size:13px;display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hdr"><h1>🚗 Ficha de Verificación de Vehículo</h1><p>Proyecto Claro · Brownfield — SIG HSEQ Grupo LPS</p></div>
    <div class="body" id="contenido"><div class="msg">Cargando...</div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://kssoegcjwngsnfwdvjne.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtzc29lZ2Nqd25nc25md2R2am5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjE3OTMsImV4cCI6MjA5OTAzNzc5M30.rtvKepiLyKEMkJPxTHw336E6UEoPyAkEX_5jU7WgGM4';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let reg=null,ctx=null,dib=false,hay=false;
function getToken(){ return new URLSearchParams(location.search).get('token'); }
function estadoDoc(fechaStr){
  if(!fechaStr) return {txt:'—',cls:''};
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const f=new Date(fechaStr+'T00:00:00');
  const dias=Math.round((f-hoy)/86400000);
  if(dias<0) return {txt:'Vencido',cls:'pill-bad'};
  if(dias<=30) return {txt:'Por vencer',cls:'pill-warn'};
  return {txt:'Vigente',cls:'pill-ok'};
}
async function cargar(){
  const token=getToken(); const cont=document.getElementById('contenido');
  if(!token){ cont.innerHTML='<div class="msg err">Enlace inválido.</div>'; return; }
  try{
    const {data,error}=await sb.from('verificacion_vehiculos').select('*').eq('firma_token',token).limit(1);
    if(error) throw error;
    if(!data||!data.length){ cont.innerHTML='<div class="msg err">No se encontró la ficha.</div>'; return; }
    reg=data[0];
    render();
  }catch(e){ cont.innerHTML='<div class="msg err">Error: '+e.message+'</div>'; }
}
function docRow(n,num,venc,noVenc){
  const e=noVenc?{txt:'',cls:''}:estadoDoc(venc);
  return '<tr><td>'+n+'</td><td>'+(num||'—')+'</td><td>'+(venc||'—')+'</td><td>'+(e.cls?'<span class="pill '+e.cls+'">'+e.txt+'</span>':'—')+'</td></tr>';
}
function render(){
  const r=reg;
  const els=r.elementos?Object.values(r.elementos).map(v=>'<div>'+(v.ok?'☑':'☐')+' '+v.label+'</div>').join(''):'<div>—</div>';
  const foto=(t,src)=>src?'<div style="text-align:center;"><img src="'+src+'"><div style="font-size:9px;color:var(--slate);">'+t+'</div></div>':'';
  const resColor=r.resultado==='Aprobado'?'pill-ok':r.resultado==='No aprobado'?'pill-bad':'pill-warn';
  let html='<div class="datos"><strong>Placa:</strong> '+(r.placa||'—')+' &nbsp; <strong>Tipo:</strong> '+(r.tipo_vehiculo||'—')+'<br>'
    +'<strong>Conductor:</strong> '+(r.conductor_nombre||'—')+' (C.C. '+(r.conductor_identificacion||'—')+')<br>'
    +'<strong>Fecha:</strong> '+((r.fecha_inspeccion||'').slice(0,16).replace('T',' '))+' &nbsp; <strong>Servicio:</strong> '+(r.tipo_servicio||'—')+'</div>';

  const anyFoto=r.foto_frontal||r.foto_lateral_der||r.foto_trasera||r.foto_lateral_izq;
  if(anyFoto) html+='<h2>Evidencia fotográfica</h2><div class="fotos">'+foto('Frontal',r.foto_frontal)+foto('Lat. der.',r.foto_lateral_der)+foto('Trasera',r.foto_trasera)+foto('Lat. izq.',r.foto_lateral_izq)+'</div>';

  html+='<h2>Documentos · Código Nacional de Tránsito</h2><table><tr><th>Documento</th><th>N°</th><th>Vence</th><th>Estado</th></tr>'
    +docRow('Licencia',r.licencia_numero,r.licencia_venc)
    +docRow('Tarjeta propiedad',r.tarjeta_propiedad,'',true)
    +docRow('SOAT',r.soat_numero,r.soat_venc)
    +docRow('RTM',r.rtm_aplica!==false?r.rtm_numero:'No aplica',r.rtm_aplica!==false?r.rtm_venc:'',r.rtm_aplica===false)
    +docRow('Pólizas',r.polizas,r.polizas_venc)+'</table>';

  html+='<h2 style="background:#16A34A;">Elementos verificados</h2><div class="els">'+els+'</div>';
  if(r.extintor_recarga) html+='<p style="font-size:12px;margin-top:6px;"><strong>Extintor próxima recarga:</strong> '+r.extintor_recarga+'</p>';
  if(r.llanta_repuesto_estado) html+='<p style="font-size:12px;"><strong>Llanta de repuesto:</strong> '+r.llanta_repuesto_estado+'</p>';

  html+='<h2 style="background:#0A2540;">Dictamen</h2><span class="res '+resColor+'">'+(r.resultado||'Sin dictamen')+'</span>';
  if(r.observaciones) html+='<p style="font-size:12px;margin-top:8px;"><strong>Observaciones:</strong> '+r.observaciones+'</p>';

  // Inspector (solo lectura)
  html+='<h2 style="background:#1598FF;">Firmas</h2>';
  html+='<div style="font-size:12px;"><strong>Realiza la inspección:</strong> '+(r.inspector_nombre||'—')+(r.inspector_cargo?' · '+r.inspector_cargo:'')+'</div>';
  if(r.firma_inspector) html+='<img src="'+r.firma_inspector+'" style="height:50px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:4px;">';

  if(r.conductor_firmado){
    html+='<div class="msg ok" style="margin-top:14px;">✅ Esta ficha ya fue firmada por el conductor. Gracias.</div>';
    document.getElementById('contenido').innerHTML=html;
    return;
  }
  // Firma del conductor
  html+='<label>Firma del conductor / responsable ('+(r.conductor_nombre||'')+')</label>'
    +'<canvas id="fc" width="600" height="150"></canvas>'
    +'<div class="row"><button class="btn btn-g" onclick="limpiar()">🗑 Borrar</button><button class="btn btn-p" onclick="firmar()">✅ Confirmar y firmar</button></div>'
    +'<p style="font-size:11px;color:var(--slate);margin-top:6px;">Al firmar confirma que recibió la inspección de su vehículo y conoce el dictamen.</p>';
  document.getElementById('contenido').innerHTML=html;
  setup();
}
function setup(){ const c=document.getElementById('fc'); if(!c)return; ctx=c.getContext('2d'); ctx.strokeStyle='#0A2540';ctx.lineWidth=2.2;ctx.lineCap='round';
  const pos=ev=>{const r=c.getBoundingClientRect();const t=ev.touches?ev.touches[0]:ev;return {x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
  c.onmousedown=ev=>{ev.preventDefault();dib=true;const p=pos(ev);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  c.onmousemove=ev=>{if(!dib)return;ev.preventDefault();const p=pos(ev);ctx.lineTo(p.x,p.y);ctx.stroke();hay=true;};
  c.onmouseup=()=>dib=false;c.onmouseleave=()=>dib=false;c.ontouchstart=c.onmousedown;c.ontouchmove=c.onmousemove;c.ontouchend=()=>dib=false;
}
function limpiar(){ const c=document.getElementById('fc'); ctx.clearRect(0,0,c.width,c.height); hay=false; }
async function firmar(){
  if(!hay){ alert('Por favor firme antes de confirmar.'); return; }
  const firma=document.getElementById('fc').toDataURL('image/png');
  try{
    const {error}=await sb.from('verificacion_vehiculos').update({firma_conductor:firma,conductor_firmado:true,estado:'COMPLETO',updated_at:new Date().toISOString()}).eq('id',reg.id);
    if(error) throw error;
    document.getElementById('contenido').innerHTML='<div class="msg ok">✅ ¡Gracias! Su firma quedó registrada.</div>';
  }catch(e){ alert('Error: '+e.message); }
}
cargar();
</script>
</body>
</html>
