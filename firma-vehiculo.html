<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de Verificación de Vehículo · LPS</title>
<style>
  :root{--navy:#0A2540;--blue:#1598FF;--blue-d:#0C6BC4;--green:#16A34A;--amber:#D97706;--danger:#DC2626;--slate:#5B6B7C;--line:#E2EBF3;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#EEF3F8;color:var(--navy);padding:14px;}
  .wrap{max-width:720px;margin:0 auto;}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 16px rgba(10,37,64,.08);overflow:hidden;margin-bottom:14px;}
  .hdr{background:var(--navy);color:#fff;padding:16px 18px;}.hdr h1{font-size:15px;}.hdr p{font-size:11px;color:#B0C9E4;margin-top:3px;}
  .body{padding:16px 18px;}
  .sec{display:flex;align-items:center;gap:8px;margin:16px 0 10px;}
  .sec .n{width:20px;height:20px;background:var(--blue);color:#fff;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
  .sec .t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .sec .ln{flex:1;height:1px;background:#DCE6F0;}
  label{font-size:10px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:3px;}
  input,select,textarea{width:100%;border:0.5px solid #D0DBE7;border-radius:7px;padding:8px 10px;font-size:12.5px;color:var(--navy);font-family:inherit;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  table{width:100%;border-collapse:collapse;font-size:11.5px;}
  th,td{padding:5px 6px;text-align:left;}
  th{color:var(--slate);font-size:10px;text-transform:uppercase;border-bottom:1px solid #EEF3F8;}
  .pill{padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}
  .pill-ok{background:#DCFCE7;color:#166534;}.pill-warn{background:#FEF3C7;color:#92600A;}.pill-bad{background:#FEE2E2;color:#991B1B;}.pill-gray{background:#EEF3F8;color:#5B6B7C;}
  .foto-box{border:1px dashed #C4D2E0;border-radius:8px;padding:14px 4px;text-align:center;cursor:pointer;background:#FCFDFE;position:relative;overflow:hidden;min-height:64px;}
  .foto-box .ic{color:var(--blue);font-size:17px;} .foto-box .lb{font-size:10px;color:var(--navy);font-weight:600;margin-top:3px;}
  .foto-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .chk{font-size:11.5px;color:#42505E;line-height:1.9;}
  .chk label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:400;text-transform:none;letter-spacing:0;margin:0;color:#42505E;}
  .chk input{width:auto;}
  .res-opt{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center;cursor:pointer;font-size:12px;color:#8494A5;}
  .res-opt.on-ok{border:1.5px solid var(--green);background:#F0FDF4;color:#166534;font-weight:600;}
  .res-opt.on-warn{border:1.5px solid #F5D06B;background:#FEFBEB;color:#92600A;font-weight:600;}
  .res-opt.on-bad{border:1.5px solid var(--danger);background:#FEF2F2;color:#991B1B;font-weight:600;}
  canvas{border:1px dashed #C4D2E0;border-radius:8px;background:#FCFDFE;width:100%;height:80px;touch-action:none;cursor:crosshair;}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-p{background:var(--green);color:#fff;}.btn-g{background:#EEF3F8;color:var(--slate);}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .msg{padding:14px;border-radius:10px;font-size:14px;text-align:center;}
  .ok{background:#DCFCE7;color:#166534;}.err{background:#FEE2E2;color:#991B1B;}
  .hint{font-size:10px;color:#94A3B8;margin-top:4px;}
  .hidden{display:none;}
</style>
</head>

</div>

const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtzc29lZ2Nqd25nc25md2R2am5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NjE3OTMsImV4cCI6MjA5OTAzNzc5M30.rtvKepiLyKEMkJPxTHw336E6UEoPyAkEX_5jU7WgGM4';

const fotos={conductor:null,frontal:null,lateral_der:null,trasera:null,lateral_izq:null};
const firmas={};

function getToken(){ return new URLSearchParams(location.search).get('token'); }
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function estadoDoc(f){ if(!f)return{txt:'—',cls:''}; const h=new Date();h.setHours(0,0,0,0); const d=Math.round((new Date(f+'T00:00:00')-h)/86400000); if(d<0)return{txt:'Vencido',cls:'pill-bad'}; if(d<=30)return{txt:'Por vencer',cls:'pill-warn'}; return{txt:'Vigente',cls:'pill-ok'};}

async function cargar(){
  const token=getToken(); const cont=document.getElementById('contenido');
  if(!token){ reg={}; editId=null; pintarFormulario('nueva'); return; }
  try{
    const {data,error}=await sb.from('verificacion_vehiculos').select('*').eq('firma_token',token).limit(1);
    if(error) throw error;
    if(!data||!data.length){ cont.innerHTML='<div class="msg err">No se encontró la ficha. Verifique el enlace.</div>'; return; }
    reg=data[0]; editId=reg.id;
    if(reg.conductor_firmado){ pintarLectura(); } else { pintarFormulario('editar'); }
  }catch(e){ cont.innerHTML='<div class="msg err">Error: '+e.message+'</div>'; }
}

function elementosHtml(tipo, marcados){
  marcados = marcados||{};
  const casco=['Certificado NTC 4533:2017 (Regl. ONU 22.05)','Sello de certificación ONAC visible','Etiqueta: talla, lote y fecha de fabricación','Coraza sin fisuras ni deterioro'];
  const epp=['Casco certificado (Res. 1080/2019)','Chaqueta con protecciones','Guantes','Rodilleras / coderas','Chaleco o bandas reflectivas','Botas o calzado cerrado'];
  const genMoto=['Luces, direccionales y frenos','Llantas y espejos','Tablero sin fallas','Estado de limpieza'];
  const botiquin=['Antisépticos','Gasas y vendas','Esparadrapo','Analgésicos','Guantes de látex','Tijeras','Algodón','Baja lenguas'];
  const kit=['Gato para elevar el vehículo','Cruceta','Dos señales triangulares reflectivas','Botiquín de primeros auxilios','Extintor vigente','Dos tacos de bloqueo','Caja de herramienta','Llanta de repuesto','Linterna'];
  const genCarro=['Tablero sin fallas','Cinturones de seguridad en buen estado','Estado de limpieza','Espejos y vidrios','Luces y direccionales'];
  const o3=(k,cur)=>'<span style="display:inline-flex;gap:6px;white-space:nowrap;font-size:10px;"><label style="color:#166534;"><input type="radio" name="'+k+'" value="bueno" '+(cur==='bueno'?'checked':'')+' style="width:auto;"> Bueno</label><label style="color:#991B1B;"><input type="radio" name="'+k+'" value="malo" '+(cur==='malo'?'checked':'')+' style="width:auto;"> Malo</label><label style="color:#5B6B7C;"><input type="radio" name="'+k+'" value="na" '+(cur==='na'?'checked':'')+' style="width:auto;"> N/A</label></span>';
  const oFuga=(k,cur)=>'<span style="display:inline-flex;gap:6px;white-space:nowrap;font-size:10px;"><label style="color:#166534;"><input type="radio" name="'+k+'" value="sin_fugas" '+(cur==='sin_fugas'?'checked':'')+' style="width:auto;"> Sin fugas</label><label style="color:#991B1B;"><input type="radio" name="'+k+'" value="con_fugas" '+(cur==='con_fugas'?'checked':'')+' style="width:auto;"> Con fugas</label><label style="color:#5B6B7C;"><input type="radio" name="'+k+'" value="na" '+(cur==='na'?'checked':'')+' style="width:auto;"> N/A</label></span>';
  const filaFuga=(k,label)=>'<div data-item="'+k+'" data-label="'+label+'" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #F4F7FB;font-size:11px;"><span>'+label+'</span>'+oFuga(k,marcados[k]?marcados[k].estado:'')+'</div>';
  const grupo=(titulo,items,pfx)=>'<div style="margin-bottom:10px;"><div style="font-size:11px;font-weight:700;margin-bottom:5px;">'+titulo+'</div><div>'+items.map((t,i)=>{const k=pfx+'_'+i;const cur=marcados[k]?marcados[k].estado:'';return '<div data-item="'+k+'" data-label="'+esc(t)+'" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #F4F7FB;font-size:11px;"><span>'+t+'</span>'+o3(k,cur)+'</div>';}).join('')+'</div></div>';
  if(tipo==='Moto'){
    return grupo('Casco · Resolución 1080 de 2019',casco,'casco')+grupo('EPP para motocicleta',epp,'epp')+grupo('Condiciones generales',genMoto,'gen')+'<div style="margin-bottom:10px;"><div style="font-size:11px;font-weight:700;margin-bottom:5px;">Fugas</div><div>'+filaFuga('fuga_comb','Fugas de combustible')+filaFuga('fuga_aceite','Fugas de aceite')+'</div></div>';
  } else if(tipo==='Carry Ref'||tipo==='Camión'){
    return grupo('Botiquín de primeros auxilios (CNT)',botiquin,'botiquin')+grupo('Kit de carretera · Art. 30 Ley 769/2002',kit,'kit')
      +'<div class="grid2"><div><label>Extintor · fecha próxima recarga</label><input type="date" id="f_extintor"></div><div><label>Estado llanta de repuesto</label><select id="f_llanta"><option value="">—</option><option>Buena</option><option>Regular</option><option>Mala</option><option>No tiene</option></select></div></div>'
      +'<div style="margin-top:8px;">'+filaFuga('fuga_comb','Fugas de combustible')+filaFuga('fuga_aceite','Fugas de aceite')+'</div>'
      +grupo('Condiciones generales',genCarro,'gen');
  }
  return '<div class="hint">Seleccione el tipo de vehículo para ver los elementos.</div>';
}
function pintarElementos(){
  const tipo=document.getElementById('f_tipo').value;
  document.getElementById('elementosArea').innerHTML=elementosHtml(tipo, (reg&&reg.elementos)||{});
  if(reg){ const ex=document.getElementById('f_extintor'); if(ex&&reg.extintor_recarga)ex.value=reg.extintor_recarga; const ll=document.getElementById('f_llanta'); if(ll&&reg.llanta_repuesto_estado)ll.value=reg.llanta_repuesto_estado; }
}

function pintarEstados(){
  [['f_licVenc','e_lic'],['f_soatVenc','e_soat'],['f_polVenc','e_pol'],['f_rtmVenc','e_rtm']].forEach(([inp,cell])=>{
    const el=document.getElementById(inp),c=document.getElementById(cell); if(!el||!c)return;
    const e=estadoDoc(el.value); c.innerHTML=e.cls?'<span class="pill '+e.cls+'">'+e.txt+'</span>':'—';
  });
}

function cargarFoto(input,key){
  const f=input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const imgTmp=new Image();
    imgTmp.onload=()=>{
      let w=imgTmp.width,h=imgTmp.height; const MAX=1000;
      if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX;} else {w=Math.round(w*MAX/h);h=MAX;} }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(imgTmp,0,0,w,h);
      let d; try{ d=cv.toDataURL('image/jpeg',0.7); }catch(_){ d=e.target.result; }
      fotos[key]=d; const img=document.getElementById('img_'+key),ic=document.getElementById('ic_'+key);
      if(img){img.src=d;img.classList.remove('hidden');} if(ic)ic.classList.add('hidden');
    };
    imgTmp.src=e.target.result;
  };
  r.readAsDataURL(f);
}

function setResultado(r){
  resultadoSel=r;
  document.getElementById('ro_apro').className='res-opt'+(r==='Aprobado'?' on-ok':'');
  document.getElementById('ro_seg').className='res-opt'+(r==='Requiere seguimiento'?' on-warn':'');
  document.getElementById('ro_no').className='res-opt'+(r==='No aprobado'?' on-bad':'');
}

function setupFirma(key){
  const c=document.getElementById('firma'+key); if(!c)return;
  const ctx=c.getContext('2d'); ctx.strokeStyle='#0A2540';ctx.lineWidth=2;ctx.lineCap='round';
  firmas[key]={ctx,hay:false,canvas:c}; let dib=false;
  const pos=ev=>{const r=c.getBoundingClientRect();const t=ev.touches?ev.touches[0]:ev;return {x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
  c.onmousedown=ev=>{ev.preventDefault();dib=true;const p=pos(ev);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  c.onmousemove=ev=>{if(!dib)return;ev.preventDefault();const p=pos(ev);ctx.lineTo(p.x,p.y);ctx.stroke();firmas[key].hay=true;};
  c.onmouseup=()=>dib=false;c.onmouseleave=()=>dib=false;c.ontouchstart=c.onmousedown;c.ontouchmove=c.onmousemove;c.ontouchend=()=>dib=false;
}
function limpiarFirma(k){const f=firmas[k];if(f){f.ctx.clearRect(0,0,f.canvas.width,f.canvas.height);f.hay=false;}}
function firmaData(k){const f=firmas[k];return (f&&f.hay)?f.canvas.toDataURL('image/png'):null;}
function pintarFirmaExistente(k,src){ if(src&&firmas[k]){const img=new Image();img.onload=()=>{firmas[k].ctx.drawImage(img,0,0,firmas[k].canvas.width,firmas[k].canvas.height);firmas[k].hay=true;};img.src=src;} }

  document.getElementById('contenido').innerHTML=banner+
  '<div class="sec"><span class="n">1</span><span class="t">Identificación</span><span class="ln"></span></div>'+
  '<div class="grid3">'+
    '<div><label>Fecha</label><input type="datetime-local" id="f_fecha"></div>'+

  '</div>'+
  '<div class="sec"><span class="n">2</span><span class="t">Conductor</span><span class="ln"></span></div>'+
  '<div style="display:flex;gap:6px;margin-bottom:8px;"><input id="f_condCedula" placeholder="Buscar por cédula en base de personal" onkeydown="if(event.key===\'Enter\')buscarConductor()"><button class="btn-g" style="padding:8px 12px;white-space:nowrap;" onclick="buscarConductor()">🔍 Buscar</button></div>'+

  '<div class="sec"><span class="n">4</span><span class="t">Documentos · CNT</span><span class="ln"></span></div>'+
  '<table><thead><tr><th>Documento</th><th>N°</th><th>Vence</th><th>Estado</th></tr></thead><tbody>'+
    '<tr><td>Licencia</td><td><input id="f_licNum" value="'+esc(r.licencia_numero||'')+'" style="font-size:11px;padding:5px;"></td><td><input type="date" id="f_licVenc" onchange="pintarEstados()" style="font-size:11px;padding:5px;"></td><td id="e_lic">—</td></tr>'+

  '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;"><span style="font-size:9.5px;color:#8494A5;">Firma del conductor / responsable</span><button class="btn-g" style="padding:4px 9px;font-size:11px;" onclick="limpiarFirma(\'Cond\')">Borrar</button></div>'+
  '<div class="row"><button class="btn btn-p" onclick="guardar()">✅ Guardar ficha</button></div>'+
  '<div class="hint">Al guardar, la ficha queda registrada en el sistema LPS. La ficha se marca como firmada cuando el conductor firma.</div>';

  const now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById('f_fecha').value = r.fecha_inspeccion ? r.fecha_inspeccion.slice(0,16) : now.toISOString().slice(0,16);
  if(r.tipo_servicio)document.getElementById('f_servicio').value=r.tipo_servicio;
  if(r.tipo_vehiculo){document.getElementById('f_tipo').value=r.tipo_vehiculo; pintarElementos();}
  if(r.licencia_venc)document.getElementById('f_licVenc').value=r.licencia_venc;
  if(r.soat_venc)document.getElementById('f_soatVenc').value=r.soat_venc;
  if(r.rtm_venc)document.getElementById('f_rtmVenc').value=r.rtm_venc;
  if(r.polizas_venc)document.getElementById('f_polVenc').value=r.polizas_venc;
  pintarEstados();
  ['conductor','frontal','lateral_der','trasera','lateral_izq'].forEach(k=>{
    const campo=k==='conductor'?'foto_conductor':'foto_'+k;
    const tiene=!!r[campo];
    fotos[k]= tiene ? r[campo] : null;
    const img=document.getElementById('img_'+k), ic=document.getElementById('ic_'+k);
    if(tiene){ if(img){img.src=r[campo];img.classList.remove('hidden');} if(ic)ic.classList.add('hidden'); }
    else { if(img){img.src='';img.classList.add('hidden');} if(ic)ic.classList.remove('hidden'); }
  });
  if(r.resultado)setResultado(r.resultado);
  setupFirma('Insp'); setupFirma('Cond');
  if(r.firma_inspector)pintarFirmaExistente('Insp',r.firma_inspector);
  if(r.firma_conductor)pintarFirmaExistente('Cond',r.firma_conductor);
}

// Búsqueda en base de personal
async function buscarConductor(){
  const ced=document.getElementById('f_condCedula').value.trim(); if(!ced)return;
  const {data}=await sb.from('empleados').select('*').eq('cedula',ced).limit(1);
  if(!data||!data.length){ alert('No se encontró la cédula '+ced+' en la base de personal. Puede escribir los datos manualmente.'); return; }
  const e=data[0];
  document.getElementById('f_condNom').value=((e.nombres||'')+' '+(e.apellidos||'')).trim();
  document.getElementById('f_condDoc').value=e.cedula;
}
async function buscarInspector(){
  const ced=document.getElementById('f_inspCedula').value.trim(); if(!ced)return;
  const {data}=await sb.from('empleados').select('*').eq('cedula',ced).limit(1);
  if(!data||!data.length){ alert('No se encontró la cédula '+ced+' en la base de personal. Puede escribir los datos manualmente.'); return; }
  const e=data[0];
  document.getElementById('f_inspNom').value=((e.nombres||'')+' '+(e.apellidos||'')).trim();
  if(e.profesion)document.getElementById('f_inspCargo').value=e.profesion;
}

function recogerElementos(){
  const out={};
  document.querySelectorAll('#elementosArea [data-item]').forEach(row=>{
    const key=row.getAttribute('data-item'), label=row.getAttribute('data-label');
    const sel=row.querySelector('input[type="radio"]:checked');
    out[key]={label, estado: sel?sel.value:''};
  });
  return out;
}

async function guardar(){
  const g=id=>{const e=document.getElementById(id);return e?(e.value.trim()||null):null;};
  if(!g('f_placa')){ alert('Ingrese la placa del vehículo.'); return; }
  const firma=firmaData('Cond');
  const firmaInsp=firmaData('Insp');
  const ext=document.getElementById('f_extintor'), ll=document.getElementById('f_llanta');
  const d={
    proyecto:'CLARO-BROWNFIELD',
    fecha_inspeccion:g('f_fecha')||new Date().toISOString(),
    gestor:g('f_gestor'), tipo_servicio:g('f_servicio'), tipo_vehiculo:g('f_tipo'),
    placa:(g('f_placa')||'').toUpperCase(), referencia_modelo:g('f_ref'),
    conductor_nombre:g('f_condNom'), conductor_identificacion:g('f_condDoc'),
    foto_conductor:fotos.conductor, foto_frontal:fotos.frontal, foto_lateral_der:fotos.lateral_der, foto_trasera:fotos.trasera, foto_lateral_izq:fotos.lateral_izq,
    licencia_numero:g('f_licNum'), licencia_venc:g('f_licVenc'),
    tarjeta_propiedad:g('f_tarPro'),
    soat_numero:g('f_soatNum'), soat_venc:g('f_soatVenc'),
    rtm_numero:g('f_rtmNum'), rtm_venc:g('f_rtmVenc'),
    polizas:g('f_polNum'), polizas_venc:g('f_polVenc'),
    elementos:recogerElementos(),
    extintor_recarga:ext?ext.value||null:null,
    llanta_repuesto_estado:ll?ll.value||null:null,
    inspector_nombre:g('f_inspNom'), inspector_cargo:g('f_inspCargo'),
    resultado:resultadoSel, observaciones:g('f_obs'),
    updated_at:new Date().toISOString()
  };
  if(firmaInsp){ d.firma_inspector=firmaInsp; }
  if(firma){ d.firma_conductor=firma; d.conductor_firmado=true; d.estado='COMPLETO'; }
  try{
    if(editId){ await sb.from('verificacion_vehiculos').update(d).eq('id',editId); }
    else { const {data,error}=await sb.from('verificacion_vehiculos').insert(d).select(); if(error)throw error; editId=data[0].id; }
    document.getElementById('contenido').innerHTML='<div class="msg ok">✅ ¡Gracias! La ficha del vehículo '+esc(d.placa)+' quedó registrada.</div>';
  }catch(e){ alert('Error al guardar: '+e.message); }
}

function pintarLectura(){
  const r=reg;
  const foto=(t,src)=>src?'<div style="text-align:center;"><img src="'+src+'" style="width:110px;height:82px;object-fit:cover;border-radius:6px;border:1px solid var(--line);"><div style="font-size:9px;color:var(--slate);">'+t+'</div></div>':'';
  const docRow=(n,num,venc,noV)=>{const e=noV?{txt:'',cls:''}:estadoDoc(venc);return '<tr><td>'+n+'</td><td>'+esc(num||'—')+'</td><td>'+esc(venc||'—')+'</td><td>'+(e.cls?'<span class="pill '+e.cls+'">'+e.txt+'</span>':'—')+'</td></tr>';};
  const estL={bueno:'✅ Buen estado',malo:'❌ Mal estado',sin_fugas:'✅ Sin fugas',con_fugas:'❌ Con fugas',na:'➖ No aplica','':'○ Sin verificar'};
  const els=r.elementos?Object.values(r.elementos).map(v=>'<div style="font-size:11px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:2px 0;"><span>'+esc(v.label)+'</span><span>'+(estL[v.estado||'']||esc(v.estado))+'</span></div>').join(''):'—';
  const resC=r.resultado==='Aprobado'?'pill-ok':r.resultado==='No aprobado'?'pill-bad':'pill-warn';
  let h='<div style="font-size:13px;"><strong>Placa:</strong> '+esc(r.placa||'—')+' &nbsp; <strong>Tipo:</strong> '+esc(r.tipo_vehiculo||'—')+'<br><strong>Conductor:</strong> '+esc(r.conductor_nombre||'—')+' (C.C. '+esc(r.conductor_identificacion||'—')+')</div>';
  const anyFoto=r.foto_frontal||r.foto_lateral_der||r.foto_trasera||r.foto_lateral_izq;
  if(anyFoto)h+='<div class="sec"><span class="t" style="color:var(--navy);">Evidencia</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;">'+foto('Frontal',r.foto_frontal)+foto('Lat. der.',r.foto_lateral_der)+foto('Trasera',r.foto_trasera)+foto('Lat. izq.',r.foto_lateral_izq)+'</div>';
  h+='<div class="sec"><span class="t" style="color:var(--navy);">Documentos</span></div><table><tr><th>Documento</th><th>N°</th><th>Vence</th><th>Estado</th></tr>'
    +docRow('Licencia',r.licencia_numero,r.licencia_venc)+docRow('Tarjeta propiedad',r.tarjeta_propiedad,'',true)+docRow('SOAT',r.soat_numero,r.soat_venc)+docRow('RTM',r.rtm_aplica!==false?r.rtm_numero:'No aplica',r.rtm_venc,r.rtm_aplica===false)+docRow('Pólizas',r.polizas,r.polizas_venc)+'</table>';
  h+='<div class="sec"><span class="t" style="color:var(--navy);">Elementos</span></div><div style="columns:2;">'+els+'</div>';
  h+='<div class="sec"><span class="t" style="color:var(--navy);">Dictamen</span></div><span class="pill '+resC+'">'+esc(r.resultado||'Sin dictamen')+'</span>';
  if(r.observaciones)h+='<p style="font-size:12px;margin-top:8px;"><strong>Obs:</strong> '+esc(r.observaciones)+'</p>';
  h+='<div class="sec"><span class="t" style="color:var(--navy);">Firmas</span></div>';
  h+='<div style="font-size:12px;"><strong>Realiza:</strong> '+esc(r.inspector_nombre||'—')+(r.inspector_cargo?' · '+esc(r.inspector_cargo):'')+'</div>';
  if(r.firma_inspector)h+='<img src="'+r.firma_inspector+'" style="height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;margin:4px 0;">';
  h+='<div style="font-size:12px;margin-top:6px;"><strong>Recibe:</strong> '+esc(r.conductor_nombre||'—')+'</div>';
  if(r.firma_conductor)h+='<img src="'+r.firma_conductor+'" style="height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;margin:4px 0;">';
  h+='<div class="msg ok" style="margin-top:14px;">✅ Esta ficha ya fue firmada y está completa.</div>';
  document.getElementById('contenido').innerHTML=h;
}

cargar();
</script>
