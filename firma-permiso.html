<title>Firma · Permiso de Trabajo en Alturas</title>
<style>
  :root{--navy:#0A2540;--blue:#1598FF;--green:#16A34A;--danger:#DC2626;--slate:#5B6B7C;--line:#E2EBF3;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#EEF1F6;color:var(--navy);padding:16px;}
  .card{background:#fff;border-radius:14px;padding:22px;max-width:600px;margin:16px auto;box-shadow:0 4px 20px rgba(10,37,64,.08);}
  .head{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px;}
  .head img{height:38px;}
  label{font-size:10px;color:var(--slate);font-weight:700;text-transform:uppercase;display:block;margin-bottom:4px;margin-top:10px;}
  input,select{width:100%;border:0.5px solid #D0DBE7;border-radius:7px;padding:9px 10px;font-size:13px;}
  .btn{border:none;border-radius:8px;padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;width:100%;margin-top:14px;background:var(--green);color:#fff;}
  .resumen{background:#F8FAFC;border-radius:8px;padding:12px;font-size:12px;margin-bottom:12px;}
  .resumen .row{display:flex;justify-content:space-between;padding:2px 0;}
  canvas{border:1px dashed #B9C7D6;border-radius:8px;width:100%;height:150px;touch-action:none;background:#fff;}
  .msg{padding:14px;border-radius:10px;font-size:13px;text-align:center;}
  .msg.ok{background:#DCFCE7;color:#166534;}.msg.err{background:#FEE2E2;color:#991B1B;}
</style>
</head>

</div>

let reg=null, firma=null, quien=null;
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function init(){
  document.getElementById('logo').src=LOGO_LPS;
  const token=new URLSearchParams(location.search).get('token');
  if(!token){ document.getElementById('contenido').innerHTML='<div class="msg err">Enlace inválido.</div>'; return; }
  const {data}=await sb.from('pta_permisos').select('*').eq('firma_token',token).limit(1);
  if(!data||!data[0]){ document.getElementById('contenido').innerHTML='<div class="msg err">Permiso no encontrado.</div>'; return; }
  reg=data[0];
  pintarSelector();
}
function pintarSelector(){
  const trab=reg.trabajadores||[];
  let opts='<option value="">— Seleccione quién firma —</option>';
  trab.forEach((t,i)=>{ opts+='<option value="trab_'+i+'">'+esc(t.nombre)+' (trabajador)</option>'; });
  if(reg.coordinador_nombre) opts+='<option value="coord">'+esc(reg.coordinador_nombre)+' (coordinador)</option>';
  if(reg.autoriza_nombre) opts+='<option value="autoriza">'+esc(reg.autoriza_nombre)+' (autoriza)</option>';
  document.getElementById('contenido').innerHTML=
    '<div class="resumen"><div class="row"><span>Permiso</span><span><b>'+esc(reg.consecutivo||'')+'</b></span></div>'+
    '<div class="row"><span>Sitio</span><span>'+esc(reg.sitio||'')+'</span></div>'+
    '<div class="row"><span>Fecha</span><span>'+esc(reg.fecha||'')+'</span></div>'+
    '<div class="row"><span>Tarea</span><span>'+esc((reg.descripcion_tarea||'').slice(0,50))+'</span></div></div>'+
    '<label>¿Quién firma?</label><select id="selQuien" onchange="quien=this.value">'+opts+'</select>'+
    '<label>Firma</label><canvas id="fc"></canvas>'+
    '<button class="btn" onclick="firmar()">✔ Firmar permiso</button>';
  setTimeout(setup,60);
}
function setup(){
  const canvas=document.getElementById('fc'); const rect=canvas.getBoundingClientRect(); canvas.width=rect.width; canvas.height=rect.height;
  const ctx=canvas.getContext('2d'); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#0A2540';
  let dib=false; firma={canvas,hay:false};
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
  function s(e){ dib=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function m(e){ if(!dib)return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); firma.hay=true; e.preventDefault(); }
  function en(){ dib=false; }
  canvas.onmousedown=s;canvas.onmousemove=m;canvas.onmouseup=en;canvas.onmouseout=en;canvas.ontouchstart=s;canvas.ontouchmove=m;canvas.ontouchend=en;
}
async function firmar(){
  if(!quien){ alert('Seleccione quién firma'); return; }
  if(!firma||!firma.hay){ alert('Debe firmar'); return; }
  const fd=firma.canvas.toDataURL('image/png');
  try{
    const upd={};
    if(quien.startsWith('trab_')){
      const i=parseInt(quien.split('_')[1],10);
      const trab=(reg.trabajadores||[]).slice();
      trab[i].firma=fd;
      upd.trabajadores=trab;
    } else if(quien==='coord'){ upd.coordinador_firma=fd; upd.coordinador_fecha=new Date().toISOString(); }
    else if(quien==='autoriza'){ upd.autoriza_firma=fd; upd.autoriza_fecha=new Date().toISOString(); }
    await sb.from('pta_permisos').update(upd).eq('id',reg.id);
    // Recargar reg para reflejar
    const {data}=await sb.from('pta_permisos').select('*').eq('id',reg.id).limit(1);
    reg=data[0];
    document.getElementById('contenido').innerHTML='<div class="msg ok">✅ Firma registrada para el permiso <b>'+esc(reg.consecutivo)+'</b>.<br>Puede cerrar esta página o pasar el dispositivo a la siguiente persona.</div>'+
      '<button class="btn" style="background:#1598FF;" onclick="pintarSelector()">Firmar otra persona</button>';
  }catch(e){ alert('Error: '+e.message); }
}
init();
</script>
