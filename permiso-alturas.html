// Calcula el 4° día hábil de un mes/año (lun-vie), como fecha límite de pago de seg. social
function cuartoDiaHabil(anio, mesIndex){
  let d=new Date(anio, mesIndex, 1); let habiles=0;
  while(true){ const dia=d.getDay(); if(dia!==0&&dia!==6){ habiles++; if(habiles===4)break; } d.setDate(d.getDate()+1); }
  return d;
}
// Estado de la seguridad social para el mes en curso
function estadoSegSocial(){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const limite=cuartoDiaHabil(hoy.getFullYear(), hoy.getMonth());
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const mesTxt=meses[hoy.getMonth()]+' '+hoy.getFullYear();
  const limTxt=limite.toISOString().slice(0,10);
  // Si hoy es posterior al 4° día hábil, el pago del mes ya debió realizarse
  return {mes:mesTxt, limite:limTxt, vencePago:(hoy>limite)};
}

// Validación: certificación de alturas del trabajador (por cursos/exámenes de su ficha)
async function certificacionAlturas(cedula){
  try{
    const [{data:cu},{data:ex}]=await Promise.all([
      sb.from('empleado_cursos').select('fecha_vencimiento,curso').eq('cedula',String(cedula)).ilike('curso','%altura%'),
      sb.from('empleado_examenes').select('fecha_vencimiento,tipo,tipo_otro').eq('cedula',String(cedula))
    ]);
    const hoyD=new Date(); hoyD.setHours(0,0,0,0);
    let vigente=false, vence=null, tiene=false;
    (cu||[]).forEach(c=>{ tiene=true; if(c.fecha_vencimiento){ const v=new Date(c.fecha_vencimiento+'T00:00:00'); if(v>=hoyD){vigente=true; if(!vence||v<new Date(vence))vence=c.fecha_vencimiento;} } });
    (ex||[]).forEach(e=>{ const t=((e.tipo||'')+' '+(e.tipo_otro||'')).toLowerCase(); if(t.includes('altura')){ tiene=true; if(e.fecha_vencimiento){ const v=new Date(e.fecha_vencimiento+'T00:00:00'); if(v>=hoyD)vigente=true; } } });
    // Examen médico ocupacional: el más reciente por vencimiento (cualquier tipo)
    let examen_vence=null, examen_vigente=false, examen_tiene=false;
    (ex||[]).forEach(e=>{ if(e.fecha_vencimiento){ examen_tiene=true; if(!examen_vence||e.fecha_vencimiento>examen_vence)examen_vence=e.fecha_vencimiento; } });
    if(examen_vence){ examen_vigente=(new Date(examen_vence+'T00:00:00')>=hoyD); }
    return {tiene,vigente,vence,examen_tiene,examen_vigente,examen_vence};
  }catch(e){ return {tiene:false,vigente:false,vence:null,examen_tiene:false,examen_vigente:false,examen_vence:null}; }
}
// Validación: inspección vencida de un equipo
async function inspeccionVencida(equipoId){
  try{
    const {data}=await sb.from('alt_inspecciones').select('proxima_inspeccion').eq('equipo_id',equipoId).order('fecha',{ascending:false}).limit(1);
    if(!data||!data[0]||!data[0].proxima_inspeccion) return {sinInsp:true};
    const v=new Date(data[0].proxima_inspeccion+'T00:00:00'); const hoyD=new Date(); hoyD.setHours(0,0,0,0);
    return {sinInsp:false,vencida:v<hoyD,proxima:data[0].proxima_inspeccion};
  }catch(e){ return {sinInsp:true}; }
}

function buscarCedValidacion(){
  const ced=document.getElementById('v_ced').value.trim();

  if(e){ document.getElementById('v_nombre').value=((e.apellidos||'')+' '+(e.nombres||'')).trim(); document.getElementById('v_cargo').value=e.cargo||''; }
  else { alert('No se encontró en la base. Puede escribir los datos manualmente.'); }

function guardarValidacion(){

function buscarRol(rol){
  const ced=(document.getElementById('p_'+rol+'_ced').value||'').trim();
  if(!ced){ alert('Escriba el documento'); return; }
  const e=empleados.find(x=>String(x.cedula)===String(ced));
  if(!e){ alert('El documento '+ced+' no está en la base de personal. Puede escribir el nombre manualmente.'); return; }
  const nombre=((e.apellidos||'')+' '+(e.nombres||'')).trim();
  document.getElementById('p_'+rol).value=nombre;

async function agregarTrabajador(){
  const ced=(document.getElementById('p_cedtrab').value||'').trim(); if(!ced){ alert('Escriba el documento de identidad'); return; }
  if(pTrab.find(t=>String(t.cedula)===String(ced))){ alert('Ese trabajador ya está agregado'); return; }
  const e=empleados.find(x=>String(x.cedula)===String(ced));
  let nombre='', cargo='';
  if(e){ nombre=((e.apellidos||'')+' '+(e.nombres||'')).trim(); cargo=e.cargo||''; }
  else {
    nombre=prompt('El documento '+ced+' no está en la base de personal.\nEscriba el NOMBRE del trabajador (o cancele):');
    if(nombre===null||!nombre.trim()) return;
    nombre=nombre.trim();
    cargo=(prompt('Cargo del trabajador (opcional):')||'').trim();
  }
  const cert=await certificacionAlturas(ced);
  const ss=estadoSegSocial();
  pTrab.push({cedula:ced,nombre,cargo,
    cert_vigente:cert.vigente,cert_tiene:cert.tiene,cert_vence:cert.vence,
    examen_vigente:cert.examen_vigente,examen_tiene:cert.examen_tiene,examen_vence:cert.examen_vence,
    arl:'Colmena',arl_otra:'',ss_mes:ss.mes,ss_pagada:false,firma:null});
  document.getElementById('p_cedtrab').value='';
  renderTrab();
}

    empresa:pAct.empresa,sitio:pAct.sitio,altura_aprox:pAct.altura_aprox,descripcion_tarea:pAct.descripcion_tarea,
    condiciones_ambientales:pAct.condiciones_ambientales,analisis_riesgos:pAct.analisis_riesgos,plan_rescate:pAct.plan_rescate,
    autoriza_nombre:pAct.autoriza_nombre,autoriza_cargo:pAct.autoriza_cargo,autoriza_ced:pAct.autoriza_ced,emergencias_nombre:pAct.emergencias_nombre,emergencias_ced:pAct.emergencias_ced,
    coordinador_nombre:pAct.coordinador_nombre,coordinador_cargo:pAct.coordinador_cargo,coordinador_ced:pAct.coordinador_ced,ayudante_nombre:pAct.ayudante_nombre,ayudante_ced:pAct.ayudante_ced,
    trabajadores:pTrab,equipos:pEquip,chequeo:pChequeo,validaciones:pValid,observaciones_generales:pAct.observaciones_generales,updated_at:new Date().toISOString()};

function validarPermiso(){
  recolectarPermiso();
  const f=[];
  if(!pAct.sitio)f.push('Sitio/lugar');
  if(!pAct.descripcion_tarea)f.push('Descripción de la tarea');
  if(!pTrab.length)f.push('Al menos un trabajador');
  if(!pAct.autoriza_nombre)f.push('Persona que autoriza');
  if(!pAct.emergencias_nombre)f.push('Responsable de emergencias');
  if(!pAct.coordinador_nombre)f.push('Coordinador de trabajo en alturas');
  // Vigencia por periodo: máximo 7 días
  if(pAct.vigencia_tipo==='periodo'){
    if(!pAct.fecha_fin){ f.push('Fecha fin (por ser vigencia por periodo)'); }
    else if(pAct.fecha && pAct.fecha_fin){
      if(pAct.fecha_fin<pAct.fecha){ f.push('La fecha fin no puede ser anterior a la inicial'); }
      else{ const d=Math.round((new Date(pAct.fecha_fin+'T00:00:00')-new Date(pAct.fecha+'T00:00:00'))/(1000*60*60*24))+1; if(d>7) f.push('El periodo no puede ser mayor a 7 días (actual: '+d+' días)'); }
    }
  }
  return f;
}

async function guardarPermiso(estado){
  recolectarPermiso();
  try{
    let id=pAct.id;
    const row=rowPermiso(); if(estado)row.estado=estado;
    if(id){ await sb.from('pta_permisos').update(row).eq('id',id); }
    else { row.creado_por=usuario; const {data,error}=await sb.from('pta_permisos').insert(row).select(); if(error)throw error; id=data[0].id; pAct.id=id; }
    await cargar();
    alert('✅ Guardado.');
    return id;
  }catch(e){ document.getElementById('p_err').textContent='Error: '+e.message; throw e; }
}
async function emitirPermiso(){
  const faltan=validarPermiso();
  if(faltan.length){ document.getElementById('p_err').innerHTML='Faltan datos obligatorios:<br>· '+faltan.join('<br>· '); return; }
  // Advertencias de validación (no bloqueantes, pero se avisan)
  const trabVenc=pTrab.filter(t=>!t.cert_vigente).map(t=>t.nombre);
  const eqVenc=pEquip.filter(e=>e.vencida).map(e=>e.codigo);
  let aviso='';
  if(trabVenc.length)aviso+='\n⚠ Trabajadores SIN certificación de alturas vigente: '+trabVenc.join(', ');
  if(eqVenc.length)aviso+='\n⚠ Equipos con inspección VENCIDA: '+eqVenc.join(', ');
  if(aviso){ if(!confirm('El permiso tiene alertas:'+aviso+'\n\n¿Emitir de todas formas?')) return; }
  try{
    if(!pAct.consecutivo){ const {data,error}=await sb.rpc('pta_siguiente'); if(error)throw error; pAct.consecutivo=data; }
    const token=pAct.firma_token||('pta_'+Math.random().toString(36).slice(2)+Date.now().toString(36));
    recolectarPermiso();
    const row=Object.assign({},rowPermiso(),{consecutivo:pAct.consecutivo,estado:'emitido',firma_token:token});
    let id=pAct.id;
    if(id){ await sb.from('pta_permisos').update(row).eq('id',id); }
    else { row.creado_por=usuario; const {data,error}=await sb.from('pta_permisos').insert(row).select(); if(error)throw error; id=data[0].id; pAct.id=id; }
    pAct.firma_token=token;
    await cargar();
    const url=location.origin+location.pathname.replace('permiso-alturas.html','firma-permiso.html')+'?token='+token;
    abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:8px;">✅ Permiso emitido: '+esc(pAct.consecutivo)+'</div>'+
      '<div class="sec-sub">Comparta este enlace para las firmas remotas, o use «Firmas presenciales».</div>'+
      '<input readonly value="'+esc(url)+'" onclick="this.select()" style="font-size:11px;">'+
      '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-p" onclick="navigator.clipboard.writeText(\''+url+'\');this.textContent=\'✅ Copiado\'">📋 Copiar enlace</button><button class="btn btn-g" onclick="cerrarModal();renderListado()">Cerrar</button></div>');
  }catch(e){ document.getElementById('p_err').textContent='Error al emitir: '+e.message; }
}

async function eliminarPermiso(id){
  if(!esAdmin){ alert('Solo el administrador.'); return; }
  const p=permisos.find(x=>x.id===id);
  if(!confirm('¿Eliminar el permiso '+(p.consecutivo||'(borrador)')+'?')) return;
  const clave=prompt('Clave de administrador (LPS-SIG):');
  if(clave!==CLAVE_ADMIN){ alert('Clave incorrecta.'); return; }
  try{ await sb.from('pta_permisos').delete().eq('id',id); await cargar(); }catch(e){ alert('Error: '+e.message); }
}

function firmasPresenciales(){
  recolectarPermiso();
  if(!pTrab.length){ alert('Agregue trabajadores antes de firmar.'); return; }
  let html='<div style="font-size:15px;font-weight:600;margin-bottom:8px;">Firmas presenciales</div><div class="sec-sub">Cada persona firma en su recuadro.</div>';
  pTrab.forEach((t,i)=>{ html+='<div style="margin-bottom:10px;"><label>'+esc(t.nombre)+' (trabajador)</label><canvas class="firma" id="fc_trab_'+i+'"></canvas></div>'; });
  if(pAct.coordinador_nombre) html+='<div style="margin-bottom:10px;"><label>'+esc(pAct.coordinador_nombre)+' (coordinador)</label><canvas class="firma" id="fc_coord"></canvas></div>';
  if(pAct.autoriza_nombre) html+='<div style="margin-bottom:10px;"><label>'+esc(pAct.autoriza_nombre)+' (autoriza)</label><canvas class="firma" id="fc_autoriza"></canvas></div>';
  html+='<div style="display:flex;gap:8px;margin-top:10px;"><button class="btn btn-p" onclick="guardarFirmas()">\u{1F4BE} Guardar firmas</button><button class="btn btn-g" onclick="cerrarModal()">Cerrar</button></div>';
  abrirModal(html,'560px');
  setTimeout(function(){ pTrab.forEach((t,i)=>setupCanvas('fc_trab_'+i)); if(pAct.coordinador_nombre)setupCanvas('fc_coord'); if(pAct.autoriza_nombre)setupCanvas('fc_autoriza'); },80);
}
function setupCanvas(id){
  const canvas=document.getElementById(id); if(!canvas)return;
  const rect=canvas.getBoundingClientRect(); canvas.width=rect.width; canvas.height=rect.height;
  const ctx=canvas.getContext('2d'); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#0A2540';
  let dib=false; canvas._hay=false;
  function pos(e){ const r=canvas.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
  function start(e){ dib=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!dib)return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); canvas._hay=true; e.preventDefault(); }
  function end(){ dib=false; }
  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseout=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;
}
async function guardarFirmas(){
  pTrab.forEach((t,i)=>{ const cv=document.getElementById('fc_trab_'+i); if(cv&&cv._hay)t.firma=cv.toDataURL('image/png'); });
  if(pAct.coordinador_nombre){ const cv=document.getElementById('fc_coord'); if(cv&&cv._hay)pAct.coordinador_firma=cv.toDataURL('image/png'); }
  if(pAct.autoriza_nombre){ const cv=document.getElementById('fc_autoriza'); if(cv&&cv._hay)pAct.autoriza_firma=cv.toDataURL('image/png'); }
  try{
    const row=Object.assign({},rowPermiso(),{coordinador_firma:pAct.coordinador_firma||null,autoriza_firma:pAct.autoriza_firma||null});
    const todosTrab=pTrab.every(t=>t.firma);
    if(todosTrab&&pAct.coordinador_firma)row.estado='firmado';
    let id=pAct.id;
    if(id){ await sb.from('pta_permisos').update(row).eq('id',id); }
    else { row.creado_por=usuario; if(!pAct.consecutivo){const r=await sb.rpc('pta_siguiente');row.consecutivo=r.data;pAct.consecutivo=r.data;} const {data,error}=await sb.from('pta_permisos').insert(row).select(); if(error)throw error; id=data[0].id; pAct.id=id; }
    cerrarModal(); await cargar(); alert('\u2705 Firmas guardadas.');
  }catch(e){ alert('Error: '+e.message); }
}
