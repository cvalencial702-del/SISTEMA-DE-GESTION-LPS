<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RQD · Solicitudes RFQ · LPS</title>
<style>
  :root{--navy:#0A2540;--blue:#1598FF;--blue-d:#0C6BC4;--green:#16A34A;--amber:#D97706;--danger:#DC2626;--slate:#5B6B7C;--line:#E2EBF3;--bg:#EEF1F6;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--navy);}
  .hidden{display:none!important;}
  input,select,textarea{width:100%;border:0.5px solid #D0DBE7;border-radius:7px;padding:9px 10px;font-size:12.5px;color:var(--navy);font-family:inherit;background:#fff;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  label{font-size:10px;color:var(--slate);font-weight:700;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px;}
  .req{color:var(--danger);}
  .btn{border:none;border-radius:8px;padding:10px 18px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-p{background:var(--blue);color:#fff;} .btn-navy{background:var(--navy);color:#fff;} .btn-green{background:var(--green);color:#fff;}
  .btn-g{background:#EEF3F8;color:#42505E;border:0.5px solid #D0DBE7;}
  .btn-sm{border:none;background:#EAF5FF;color:var(--blue-d);border-radius:6px;padding:5px 9px;font-size:11px;cursor:pointer;}
  .pill{padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;display:inline-block;}
  .pill-ok{background:#DCFCE7;color:#166534;}.pill-warn{background:#FEF3C7;color:#92600A;}.pill-bad{background:#FEE2E2;color:#991B1B;}.pill-gray{background:#EEF3F8;color:#5B6B7C;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;padding:9px 8px;font-weight:600;color:var(--slate);border-bottom:1px solid #EEF3F8;font-size:10.5px;text-transform:uppercase;}
  td{padding:8px;border-bottom:1px solid #F4F7FB;}
  .card{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:18px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 14px;}

  #login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:100;}
  #login .box{background:#fff;border-radius:16px;padding:32px;width:370px;max-width:92vw;}
  #login .logo{width:52px;height:52px;background:var(--blue);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;margin:0 auto 16px;}

  #app{max-width:1080px;margin:0 auto;padding:0 0 40px;}
  .topbar{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .logo{width:34px;height:34px;background:var(--blue);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-right:10px;}
  .tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;overflow-x:auto;}
  .tabs a{padding:13px 16px;font-size:12.5px;color:var(--slate);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .tabs a.active{color:var(--blue-d);border-bottom-color:var(--blue);font-weight:600;}
  .content{padding:22px;}
  .view{display:none;} .view.active{display:block;}
  .sec-title{font-size:17px;font-weight:600;margin-bottom:3px;}
  .sec-sub{font-size:11.5px;color:var(--slate);margin-bottom:16px;}

  .steps{display:flex;gap:8px;margin-bottom:18px;}
  .step{flex:1;text-align:center;padding:10px;border-radius:9px;background:#fff;border:0.5px solid var(--line);font-size:11.5px;color:var(--slate);cursor:pointer;}
  .step.active{background:var(--blue);color:#fff;font-weight:600;border-color:var(--blue);}
  .step.done{background:#EAF5FF;color:var(--blue-d);}
  .step-num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.08);align-items:center;justify-content:center;font-size:10px;margin-right:5px;}

  .field-sec{margin-bottom:18px;}
  .field-sec h3{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #EEF3F8;}
  .margen-box{background:#F0F7FF;border:1px solid #B9D8F5;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;}
  .modal-bg{position:fixed;inset:0;background:rgba(10,37,64,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:14px;padding:22px;width:620px;max-width:96vw;max-height:90vh;overflow:auto;}
  .money{font-variant-numeric:tabular-nums;}
</style>
</head>

</div>

let sesion={nombre:'Usuario'};   // acceso general; nombre para trazabilidad

// Cliente → segmentos en cascada
const SEGMENTOS={
  'Claro':['ODH','ODN','I+M','Otros'],
  'Towernex':['Reparos','Mantenimientos','Otros'],
  'ATP307K':['D&A','COLO','Otros'],
  'ATP Torres':['Mantenimiento','Otros'],
  'Transversal':['Talento Humano','Compras','Logística','SIG','Gerencia General','Comercial','IT','Financiera','Legal','Otros'],
  'Otros':[]
};
const UNIDADES=['unidad','servicio','hora','día','metro','kilómetro','lote','otro'];

// Pestañas: todos ven Nueva/Mis/Consulta; Administración y Config solo admin
const TABS=[
  {id:'nueva',label:'Nueva RFQ',admin:false},
  {id:'mis',label:'Solicitudes',admin:false},
  {id:'admin',label:'Administración',admin:true},
  {id:'config',label:'Configuración',admin:true},
];

function pintarAdminBtn(){
  document.getElementById('adminBtn').innerHTML=esAdmin
    ? '<span class="pill pill-ok" style="margin-right:8px;">🔓 Administrador</span><button class="btn-sm" style="background:rgba(255,255,255,.2);color:#fff;" onclick="bloquearAdmin()">Bloquear</button>'
    : '<button class="btn-sm" style="background:rgba(255,255,255,.2);color:#fff;" onclick="pedirAdmin()">🔒 Modo administrador</button>';
}
function pedirAdmin(){
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:10px;">Modo administrador</div>'+
    '<div style="font-size:11.5px;color:var(--slate);margin-bottom:12px;">Solo el administrador puede aprobar, rechazar, cambiar fase y configurar el umbral.</div>'+
    '<label>Su nombre (para trazabilidad)</label><input id="adm_nom" value="'+esc(sesion.nombre==='Usuario'?'':sesion.nombre)+'">'+
    '<div style="height:10px;"></div><label>Clave de administrador</label><input type="password" id="adm_clave" onkeydown="if(event.key===\'Enter\')validarAdmin()">'+
    '<div id="admErr" style="color:var(--danger);font-size:11px;margin-top:8px;"></div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;"><button class="btn btn-p" onclick="validarAdmin()">Desbloquear</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div>');
}
function validarAdmin(){
  const clave=document.getElementById('adm_clave').value;
  const nom=document.getElementById('adm_nom').value.trim();
  if(clave!==CLAVE_ADMIN){ document.getElementById('admErr').textContent='Clave incorrecta.'; return; }
  esAdmin=true; if(nom)sesion.nombre=nom;
  cerrarModal(); pintarAdminBtn(); construirTabs();
}
function bloquearAdmin(){ esAdmin=false; pintarAdminBtn(); construirTabs(); }

function construirTabs(){
  const permitidas=TABS.filter(t=>!t.admin||esAdmin);
  document.getElementById('tabs').innerHTML=permitidas.map(t=>'<a id="tab-'+t.id+'" onclick="irA(\''+t.id+'\')">'+t.label+'</a>').join('');
  const actual=document.querySelector('.tabs a.active');
  irA(actual&&permitidas.find(t=>'tab-'+t.id===actual.id)?actual.id.replace('tab-',''):permitidas[0].id);
}
function irA(id){
  document.querySelectorAll('.tabs a').forEach(a=>a.classList.remove('active'));
  const t=document.getElementById('tab-'+id); if(t)t.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+id).classList.add('active');
  RENDER[id]();
}

function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){ n=Number(n)||0; return '$'+n.toLocaleString('es-CO'); }
function abrirModal(html){ document.getElementById('modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)cerrarModal()"><div class="modal">'+html+'</div></div>'; }
function cerrarModal(){ document.getElementById('modalRoot').innerHTML=''; }
async function bitacora(rfq_id,consecutivo,accion,detalle){ try{ await sb.from('rfq_bitacora').insert({rfq_id:rfq_id||null,consecutivo:consecutivo||null,usuario:sesion.nombre,accion,detalle:detalle||null}); }catch(e){} }

const RENDER={};

// ===== Estado del formulario en memoria =====
let rfqActual=null;
let items=[];
let adjuntosGen=[];
let pasoActual=1;

function nuevoRFQ(){
  rfqActual={id:null,cliente:'',cliente_otro:'',segmento:'',segmento_otro:'',presupuesto_facturacion:0,presupuesto_costo:0,lugar_ejecucion:'',fecha_entrega:'',observaciones:'',estado:'borrador'};
  items=[]; adjuntosGen=[]; pasoActual=1;
  RENDER.nueva();
}

RENDER.nueva=function(){
  if(!rfqActual){ nuevoRFQ(); return; }
  const d=rfqActual;
  const c=document.getElementById('v-nueva');
  c.innerHTML='<div class="sec-title">'+(d.id?'Editar':'Nueva')+' solicitud RFQ</div><div class="sec-sub">Complete los tres pasos. El número de RFQ se asigna al generar el PDF.</div>'+
    '<div class="steps">'+
      '<div class="step" id="stp1" onclick="irPaso(1)"><span class="step-num">1</span>Cliente</div>'+
      '<div class="step" id="stp2" onclick="irPaso(2)"><span class="step-num">2</span>Datos de la OT</div>'+
      '<div class="step" id="stp3" onclick="irPaso(3)"><span class="step-num">3</span>Ítems y adjuntos</div>'+
    '</div>'+
    '<div class="card"><div id="pasoBody"></div></div>';
  irPaso(pasoActual);
};

function irPaso(n){
  pasoActual=n;
  [1,2,3].forEach(i=>{ const s=document.getElementById('stp'+i); if(s){ s.className='step'+(i===n?' active':(i<n?' done':'')); } });
  const b=document.getElementById('pasoBody');
  if(n===1){ b.innerHTML=pasoCliente(); initPaso1(); }
  else if(n===2){ b.innerHTML=pasoOT(); calcMargen(); }
  else { b.innerHTML=pasoItems(); renderItems(); renderAdjGen(); }
}

// ---- Paso 1: Cliente y segmento ----
function pasoCliente(){
  const d=rfqActual;
  const clientes=Object.keys(SEGMENTOS);
  const optsCli='<option value="">— Seleccione —</option>'+clientes.map(x=>'<option value="'+x+'"'+(d.cliente===x?' selected':'')+'>'+x+'</option>').join('');
  return '<div class="field-sec"><h3>Cliente y segmentación</h3>'+
    '<div class="grid2">'+
      '<div><label>Cliente <span class="req">*</span></label><select id="f_cliente" onchange="onCliente()">'+optsCli+'</select></div>'+
      '<div id="wrapClienteOtro" style="display:none;"><label>¿Cuál cliente? <span class="req">*</span></label><input id="f_clienteOtro" value="'+esc(d.cliente_otro||'')+'"></div>'+
      '<div id="wrapSegmento"><label>Segmento <span class="req">*</span></label><select id="f_segmento" onchange="onSegmento()"></select></div>'+
      '<div id="wrapSegmentoOtro" style="display:none;"><label>¿Cuál segmento? <span class="req">*</span></label><input id="f_segmentoOtro" value="'+esc(d.segmento_otro||'')+'"></div>'+
    '</div></div>'+
    '<div style="display:flex;justify-content:flex-end;gap:8px;"><button class="btn btn-p" onclick="guardarPaso1()">Siguiente →</button></div>';
}
function initPaso1(){
  const d=rfqActual;
  const cli=d.cliente||'';
  document.getElementById('wrapClienteOtro').style.display = cli==='Otros'?'block':'none';
  const wrapSeg=document.getElementById('wrapSegmento');
  if(cli==='Otros'){ wrapSeg.style.display='none'; }
  else if(cli){
    wrapSeg.style.display='block';
    const segs=SEGMENTOS[cli]||[];
    document.getElementById('f_segmento').innerHTML='<option value="">— Seleccione —</option>'+segs.map(s=>'<option value="'+s+'"'+(d.segmento===s?' selected':'')+'>'+s+'</option>').join('');
    document.getElementById('wrapSegmentoOtro').style.display = d.segmento==='Otros'?'block':'none';
  }
}
function onCliente(){
  const cli=document.getElementById('f_cliente').value;
  document.getElementById('wrapClienteOtro').style.display = cli==='Otros'?'block':'none';
  const wrapSeg=document.getElementById('wrapSegmento');
  const segs=SEGMENTOS[cli]||[];
  if(cli==='Otros'){ wrapSeg.style.display='none'; }
  else {
    wrapSeg.style.display='block';
    document.getElementById('f_segmento').innerHTML='<option value="">— Seleccione —</option>'+segs.map(s=>'<option value="'+s+'">'+s+'</option>').join('');
  }
  const so=document.getElementById('wrapSegmentoOtro'); if(so)so.style.display='none';
}
function onSegmento(){
  const s=document.getElementById('f_segmento');
  const seg=s?s.value:'';
  const wrap=document.getElementById('wrapSegmentoOtro');
  if(wrap)wrap.style.display = seg==='Otros'?'block':'none';
}
function guardarPaso1(){
  const cli=document.getElementById('f_cliente').value;
  if(!cli){ alert('Seleccione el cliente'); return; }
  rfqActual.cliente=cli;
  rfqActual.cliente_otro=cli==='Otros'?(document.getElementById('f_clienteOtro').value.trim()):'';
  if(cli==='Otros'&&!rfqActual.cliente_otro){ alert('Indique cuál cliente'); return; }
  if(cli==='Otros'){ rfqActual.segmento='Otros'; rfqActual.segmento_otro=rfqActual.cliente_otro; }
  else {
    const seg=document.getElementById('f_segmento').value;
    if(!seg){ alert('Seleccione el segmento'); return; }
    rfqActual.segmento=seg;
    rfqActual.segmento_otro=seg==='Otros'?(document.getElementById('f_segmentoOtro').value.trim()):'';
    if(seg==='Otros'&&!rfqActual.segmento_otro){ alert('Indique cuál segmento'); return; }
  }
  irPaso(2);
}

// ---- Paso 2: Datos de la OT ----
function pasoOT(){
  const d=rfqActual;
  return '<div class="field-sec"><h3>Datos de la orden de trabajo</h3>'+
    '<div class="grid2">'+
      '<div><label>Presupuesto facturación (COP) <span class="req">*</span></label><input type="number" id="f_fact" min="0" value="'+(d.presupuesto_facturacion||'')+'" oninput="calcMargen()"></div>'+
      '<div><label>Presupuesto costo (COP) <span class="req">*</span></label><input type="number" id="f_costo" min="0" value="'+(d.presupuesto_costo||'')+'" oninput="calcMargen()"></div>'+
    '</div>'+
    '<div class="margen-box" style="margin:12px 0;"><span>Margen estimado</span><strong id="margenTxt" class="money">$0</strong></div>'+
    '<div class="grid2">'+
      '<div><label>Lugar de ejecución <span class="req">*</span></label><input id="f_lugar" value="'+esc(d.lugar_ejecucion||'')+'"></div>'+
      '<div><label>Fecha de entrega <span class="req">*</span></label><input type="date" id="f_entrega" value="'+esc(d.fecha_entrega||'')+'"></div>'+
      '<div><label>Solicitante <span class="req">*</span></label><input id="f_solic" value="'+esc(rfqActual.solicitante||(sesion.nombre==='Usuario'?'':sesion.nombre))+'" placeholder="Nombre de quien solicita"></div>'+
      '<div><label>Fecha y hora de solicitud</label><input value="'+(d.fecha_solicitud?new Date(d.fecha_solicitud).toLocaleString('es-CO'):'Se registra al crear')+'" readonly></div>'+
    '</div>'+
    '<div style="margin-top:12px;"><label>Observaciones generales</label><textarea id="f_obs" rows="2">'+esc(d.observaciones||'')+'</textarea></div></div>'+
    '<div style="display:flex;justify-content:space-between;gap:8px;"><button class="btn btn-g" onclick="irPaso(1)">← Atrás</button><button class="btn btn-p" onclick="guardarPaso2()">Siguiente →</button></div>';
}
function calcMargen(){
  const ef=document.getElementById('f_fact'), ec=document.getElementById('f_costo');
  const f=Number(ef?ef.value:rfqActual.presupuesto_facturacion)||0;
  const co=Number(ec?ec.value:rfqActual.presupuesto_costo)||0;
  const m=f-co; const pct=f>0?((m/f)*100).toFixed(1)+'%':'—';
  const el=document.getElementById('margenTxt');
  if(el){ el.textContent=money(m)+(f>0?'  ('+pct+')':''); el.style.color=m<0?'var(--danger)':'var(--green)'; }
}
function guardarPaso2(){
  const f=Number(document.getElementById('f_fact').value)||0, co=Number(document.getElementById('f_costo').value)||0;
  if(f<0||co<0){ alert('Los presupuestos no admiten valores negativos'); return; }
  rfqActual.presupuesto_facturacion=f; rfqActual.presupuesto_costo=co;
  rfqActual.lugar_ejecucion=document.getElementById('f_lugar').value.trim();
  rfqActual.fecha_entrega=document.getElementById('f_entrega').value;
  rfqActual.solicitante=document.getElementById('f_solic').value.trim();
  rfqActual.observaciones=document.getElementById('f_obs').value.trim();
  irPaso(3);
}

// ---- Paso 3: Ítems y adjuntos ----
function pasoItems(){
  return '<div class="field-sec"><h3>Ítems solicitados</h3>'+
    '<table><thead><tr><th>#</th><th>Descripción</th><th>Alcance</th><th>Cant.</th><th>Unidad</th><th>Adj.</th><th></th></tr></thead><tbody id="itemsBody"></tbody></table>'+
    '<button class="btn btn-g" style="margin-top:10px;" onclick="formItem()">＋ Agregar ítem</button></div>'+
    '<div class="field-sec"><h3>Adjuntos generales de la RFQ</h3>'+
    '<div id="adjGenList" style="font-size:11.5px;color:var(--slate);margin-bottom:8px;"></div>'+
    '<input type="file" id="f_adjGen" multiple onchange="cargarAdjGen(this)" style="font-size:11px;">'+
    '<div style="font-size:9.5px;color:#94A3B8;margin-top:4px;">Formatos: PDF, XLSX, DOCX, JPG, PNG, ZIP. Los archivos se guardan en el sistema.</div></div>'+
    '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><button class="btn btn-g" onclick="irPaso(2)">← Atrás</button>'+

    )+'</div>';
}
function renderItems(){
  const b=document.getElementById('itemsBody'); if(!b)return;
  b.innerHTML=items.length?items.map((it,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(it.descripcion)+'</td><td style="font-size:11px;color:var(--slate);">'+esc(it.alcance||'')+'</td><td>'+esc(it.cantidad)+'</td><td>'+esc(it.unidad)+'</td><td>'+((it.adjuntos&&it.adjuntos.length)||0)+'</td><td style="white-space:nowrap;"><button class="btn-sm" onclick="formItem('+i+')">✏️</button> <button class="btn-sm" onclick="dupItem('+i+')">⧉</button> <button class="btn-sm" style="background:#FEE2E2;color:#991B1B;" onclick="delItem('+i+')">🗑</button></td></tr>').join(''):'<tr><td colspan="7" style="text-align:center;color:var(--slate);padding:16px;">Sin ítems. Agregue al menos uno.</td></tr>';
}
function formItem(i){
  const it=(i!=null)?items[i]:{descripcion:'',alcance:'',cantidad:1,unidad:'unidad',adjuntos:[]};
  const optsU=UNIDADES.map(u=>'<option'+(it.unidad===u?' selected':'')+'>'+u+'</option>').join('');
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:12px;">'+(i!=null?'Editar':'Nuevo')+' ítem</div>'+
    '<div><label>Descripción <span class="req">*</span></label><input id="it_desc" value="'+esc(it.descripcion)+'"></div>'+
    '<div style="margin-top:10px;"><label>Alcance <span class="req">*</span></label><textarea id="it_alc" rows="2">'+esc(it.alcance||'')+'</textarea></div>'+
    '<div class="grid2" style="margin-top:10px;"><div><label>Cantidad <span class="req">*</span></label><input type="number" id="it_cant" min="0.01" step="any" value="'+esc(it.cantidad)+'"></div><div><label>Unidad</label><select id="it_uni">'+optsU+'</select></div></div>'+
    '<div style="margin-top:10px;"><label>Adjuntos del ítem</label><input type="file" id="it_adj" multiple style="font-size:11px;"><div style="font-size:9.5px;color:#94A3B8;margin-top:3px;">'+((it.adjuntos&&it.adjuntos.length)?'Ya cargados: '+it.adjuntos.map(a=>esc(a.nombre)).join(', '):'')+'</div></div>'+
    '<div style="display:flex;gap:8px;margin-top:16px;"><button class="btn btn-p" onclick="guardarItem('+(i!=null?i:'null')+')">Guardar ítem</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div>');
}
async function guardarItem(i){
  const desc=document.getElementById('it_desc').value.trim();
  const alc=document.getElementById('it_alc').value.trim();
  const cant=Number(document.getElementById('it_cant').value);
  const uni=document.getElementById('it_uni').value;
  if(!desc){ alert('La descripción es obligatoria'); return; }
  if(!alc){ alert('El alcance es obligatorio'); return; }
  if(!(cant>0)){ alert('La cantidad debe ser mayor que cero'); return; }
  const adjInput=document.getElementById('it_adj');
  let adjuntos=(i!=null&&items[i].adjuntos)?items[i].adjuntos.slice():[];
  const btn=document.querySelector('#modalRoot .btn-p');
  if(adjInput&&adjInput.files.length){
    if(btn){ btn.disabled=true; btn.textContent='Subiendo archivos…'; }
    let fallo=false;
    for(const f of adjInput.files){
      try{
        const path='items/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+f.name.replace(/[^\w.\-]/g,'_');
        const {error}=await sb.storage.from('rfq-adjuntos').upload(path,f,{upsert:true});
        if(error)throw error;
        const {data}=sb.storage.from('rfq-adjuntos').getPublicUrl(path);
        adjuntos.push({nombre:f.name,tipo:f.type||'archivo',tamano:f.size,url:data.publicUrl,path});
      }catch(e){ fallo=true; alert('No se pudo subir "'+f.name+'": '+e.message+'\n\nRevise el tamaño (máx 50MB) o la conexión e intente de nuevo.'); }
    }
    if(btn){ btn.disabled=false; btn.textContent='Guardar ítem'; }
    // Si algún archivo falló, no cerramos el modal para que el usuario reintente
    if(fallo){ return; }
  }
  const obj={descripcion:desc,alcance:alc,cantidad:cant,unidad:uni,adjuntos};
  if(i!=null)items[i]=obj; else items.push(obj);
  cerrarModal(); renderItems();
}
function dupItem(i){ const c=JSON.parse(JSON.stringify(items[i])); items.splice(i+1,0,c); renderItems(); }
function delItem(i){ items.splice(i,1); renderItems(); }
async function cargarAdjGen(input){
  const el=document.getElementById('adjGenList');
  for(const f of input.files){
    const item={nombre:f.name,tipo:f.type||'archivo',tamano:f.size,url:null,subiendo:true};
    adjuntosGen.push(item); renderAdjGen();
    try{
      const path='general/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+f.name.replace(/[^\w.\-]/g,'_');
      const {error}=await sb.storage.from('rfq-adjuntos').upload(path,f,{upsert:true});
      if(error)throw error;
      const {data}=sb.storage.from('rfq-adjuntos').getPublicUrl(path);
      item.url=data.publicUrl; item.path=path; item.subiendo=false;
    }catch(e){ item.error=true; item.subiendo=false; alert('No se pudo subir '+f.name+': '+e.message); }
    renderAdjGen();
  }
  input.value='';
}
function renderAdjGen(){
  const el=document.getElementById('adjGenList'); if(!el)return;
  el.innerHTML=adjuntosGen.length?adjuntosGen.map((a,i)=>{
    const estado=a.subiendo?' <span style="color:var(--amber);">(subiendo…)</span>':(a.error?' <span style="color:var(--danger);">(error)</span>':' ✅');
    const link=a.url?'<a href="'+a.url+'" target="_blank" style="color:var(--blue-d);">'+esc(a.nombre)+'</a>':esc(a.nombre);
    return '📎 '+link+estado+' <a onclick="adjuntosGen.splice('+i+',1);renderAdjGen()" style="color:var(--danger);cursor:pointer;">✕</a>';
  }).join('<br>'):'Sin adjuntos generales.';
}

// ===== Guardar / emitir =====
function rowRFQ(){
  return {cliente:rfqActual.cliente,cliente_otro:rfqActual.cliente_otro||null,segmento:rfqActual.segmento,segmento_otro:rfqActual.segmento_otro||null,
    presupuesto_facturacion:rfqActual.presupuesto_facturacion||0,presupuesto_costo:rfqActual.presupuesto_costo||0,
    lugar_ejecucion:rfqActual.lugar_ejecucion||null,fecha_entrega:rfqActual.fecha_entrega||null,
    solicitante:rfqActual.solicitante||sesion.nombre,observaciones:rfqActual.observaciones||null,adjuntos:adjuntosGen,updated_at:new Date().toISOString()};
}
async function persistir(){
  // Inserta o actualiza la RFQ y sus ítems; devuelve el id
  let id=rfqActual.id;
  if(id){ await sb.from('rfq_solicitudes').update(rowRFQ()).eq('id',id); }
  else { const {data,error}=await sb.from('rfq_solicitudes').insert(rowRFQ()).select(); if(error)throw error; id=data[0].id; rfqActual.id=id; rfqActual.fecha_solicitud=data[0].fecha_solicitud; }
  // Reemplazar ítems
  await sb.from('rfq_items').delete().eq('rfq_id',id);
  if(items.length){ await sb.from('rfq_items').insert(items.map((it,idx)=>({rfq_id:id,orden:idx+1,descripcion:it.descripcion,alcance:it.alcance,cantidad:it.cantidad,unidad:it.unidad,adjuntos:it.adjuntos||[]}))); }
  return id;
}
async function guardarBorrador(){
  if(!rfqActual.cliente){ alert('Complete al menos el cliente (paso 1)'); return; }
  try{ const id=await persistir(); await bitacora(id,rfqActual.consecutivo,'guardar_borrador','Cliente '+rfqActual.cliente); alert('✅ Borrador guardado. Puede continuar luego desde "Solicitudes".'); }
  catch(e){ alert('Error al guardar: '+e.message); }
}
async function guardarEdicion(){
  // Edición de una RFQ ya emitida: conserva consecutivo. Si estaba decidida (aprobada/rechazada),
  // vuelve a 'pendiente' para reactivar la decisión (Decidir/Fase).
  const faltan=validarCompleto();
  if(faltan.length){ alert('Faltan datos obligatorios:\n· '+faltan.join('\n· ')); return; }
  const eraDecidida=(rfqActual.estado==='aprobado'||rfqActual.estado==='rechazado');
  try{
    const id=await persistir();
    if(eraDecidida){
      // Reabrir: vuelve a pendiente, limpia motivo de rechazo y fase (se vuelven a decidir)
      await sb.from('rfq_solicitudes').update({estado:'pendiente',motivo_rechazo:null,fase:null}).eq('id',id);
      rfqActual.estado='pendiente';
    }
    // Si esta RFQ tenía edición individual habilitada, se consume (se deshabilita tras editar)
    if(rfqActual.edicion_habilitada){ await sb.from('rfq_solicitudes').update({edicion_habilitada:false}).eq('id',id); rfqActual.edicion_habilitada=false; }
    await bitacora(id,rfqActual.consecutivo,'editar','RFQ modificada por '+(esAdmin?sesion.nombre+' (admin)':sesion.nombre)+(eraDecidida?' · reabierta a PENDIENTE para nueva decisión':'')+' · '+items.length+' ítems, facturación '+money(rfqActual.presupuesto_facturacion));
    alert('✅ Cambios guardados en '+(rfqActual.consecutivo||'la solicitud')+'.'+(eraDecidida?'\nLa RFQ volvió a PENDIENTE: use «Decidir» para aprobar/rechazar de nuevo.':'')+'\nEl cambio quedó registrado en la bitácora.');
    if(esAdmin){ irA('admin'); } else { irA('mis'); }
  }catch(e){ alert('Error al guardar los cambios: '+e.message); }
}
function validarCompleto(){
  const faltan=[];
  if(!rfqActual.cliente) faltan.push('cliente');
  if(!rfqActual.segmento) faltan.push('segmento');
  if(!(rfqActual.presupuesto_facturacion>0)) faltan.push('presupuesto facturación');
  if(!(rfqActual.presupuesto_costo>=0)) faltan.push('presupuesto costo');
  if(!rfqActual.lugar_ejecucion) faltan.push('lugar de ejecución');
  if(!rfqActual.fecha_entrega) faltan.push('fecha de entrega');
  if(!rfqActual.solicitante) faltan.push('solicitante');
  if(!items.length) faltan.push('al menos un ítem');
  return faltan;
}
async function crearLinkFirma(){
  const faltan=validarCompleto();
  if(faltan.length){ alert('Faltan datos obligatorios antes de enviar a firma:\n· '+faltan.join('\n· ')); return; }
  try{
    let id=await persistir();
    // Generar token de firma y marcar como 'por_firmar' (aún SIN consecutivo ni PDF)
    let token=rfqActual.firma_token;
    if(!token){ token='rfq_'+Math.random().toString(36).slice(2)+Date.now().toString(36); }
    await sb.from('rfq_solicitudes').update({firma_token:token,estado:'por_firmar'}).eq('id',id);
    rfqActual.firma_token=token; rfqActual.estado='por_firmar';
    await bitacora(id,null,'enviar_a_firma','Link de firma generado para el aprobador');
    const base=location.href.split('?')[0].replace(/[^/]*$/,'');
    const link=base+'rqd-firma.html?token='+token;
    abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:6px;">🔗 Link para firma del aprobador</div>'+
      '<div class="sec-sub">La RFQ y el PDF <b>solo se generan cuando el aprobador firme</b> por este enlace.</div>'+
      '<div style="display:flex;gap:8px;"><input readonly id="linkFirma" value="'+link+'" style="font-size:11px;"><button class="btn btn-p" onclick="copiarLinkFirma()">Copiar</button></div>'+
      '<div style="font-size:10px;color:var(--slate);margin-top:8px;">Envíelo al aprobador. Al firmar, se asignará el consecutivo RFQ-LPS y quedará emitida.</div>'+
      (adjuntosGen.length?'<div style="font-size:10px;color:var(--amber);margin-top:6px;">📎 La RFQ contiene '+adjuntosGen.length+' adjunto(s).</div>':'')+
      '<div style="text-align:right;margin-top:14px;"><button class="btn btn-g" onclick="cerrarModal()">Cerrar</button></div>');
  }catch(e){ alert('Error: '+e.message); }
}
function copiarLinkFirma(){ const i=document.getElementById('linkFirma'); i.select(); document.execCommand('copy'); alert('Link copiado'); }

let _misData=[], misOrdenAsc=false, misAgrupar='';
RENDER.mis=async function(){
  const c=document.getElementById('v-mis');
  await cargarConfig();
  const {data}=await sb.from('rfq_solicitudes').select('*');
  _misData=data||[];
  // Poblar clientes únicos para el filtro
  const clientes=[...new Set(_misData.map(r=>r.cliente==='Otros'?(r.cliente_otro||'Otros'):r.cliente).filter(Boolean))].sort();
  c.innerHTML='<div class="sec-title">Solicitudes</div><div class="sec-sub">Borradores, emitidas, aprobadas y rechazadas</div>'+
    '<div class="card" style="padding:12px 14px;margin-bottom:10px;"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">'+
      '<div><label style="font-size:9.5px;color:var(--slate);text-transform:uppercase;">Cliente</label><select id="m_cli" onchange="pintarMis()"><option value="">Todos</option>'+clientes.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></div>'+
      '<div><label style="font-size:9.5px;color:var(--slate);text-transform:uppercase;">Estado</label><select id="m_est" onchange="pintarMis()"><option value="">Todos</option><option value="borrador">Borrador</option><option value="por_firmar">Por firmar</option><option value="pendiente">Pendiente</option><option value="aprobado">Aprobado</option><option value="rechazado">Rechazado</option></select></div>'+
      '<div><label style="font-size:9.5px;color:var(--slate);text-transform:uppercase;">Fase</label><select id="m_fase" onchange="pintarMis()"><option value="">Todas</option><option value="terminado">Terminado</option><option value="gestion">Gestión</option><option value="restriccion">Restricción</option></select></div>'+
      '<div><label style="font-size:9.5px;color:var(--slate);text-transform:uppercase;">Agrupar por</label><select id="m_grp" onchange="pintarMis()"><option value="">Sin agrupar</option><option value="cliente">Cliente</option><option value="estado">Estado</option><option value="fase">Fase</option></select></div>'+
      '<div style="grid-column:1/3;"><label style="font-size:9.5px;color:var(--slate);text-transform:uppercase;">Buscar (RFQ, cliente, solicitante)</label><input id="m_txt" oninput="pintarMis()" placeholder="Texto…"></div>'+
      '<div style="display:flex;align-items:flex-end;"><button class="btn btn-g" style="width:100%;" onclick="toggleOrdenMis()"><span id="m_ordlbl">↓ Descendente</span></button></div>'+
      '<div style="display:flex;align-items:flex-end;"><button class="btn btn-g" style="width:100%;" onclick="limpiarMis()">Limpiar</button></div>'+
    '</div></div>'+
    '<div class="card" style="padding:6px 16px 14px;overflow-x:auto;"><table><thead><tr><th>RFQ</th><th>Cliente</th><th>Segmento</th><th>Solicitante</th><th>Facturación</th><th>Estado</th><th>Fase</th><th></th></tr></thead><tbody id="misBody"></tbody></table></div>';
  pintarMis();
};
function numRFQ(cons){ if(!cons)return 0; const m=String(cons).match(/-(\d+)$/); return m?parseInt(m[1],10):0; }
function toggleOrdenMis(){ misOrdenAsc=!misOrdenAsc; document.getElementById('m_ordlbl').textContent=misOrdenAsc?'↑ Ascendente':'↓ Descendente'; pintarMis(); }
function limpiarMis(){ ['m_cli','m_est','m_fase','m_grp','m_txt'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';}); pintarMis(); }
function pintarMis(){
  const cli=document.getElementById('m_cli').value, est=document.getElementById('m_est').value, fase=document.getElementById('m_fase').value;
  const grp=document.getElementById('m_grp').value, txt=(document.getElementById('m_txt').value||'').toLowerCase();
  let rows=_misData.filter(r=>{
    const c1=r.cliente==='Otros'?(r.cliente_otro||'Otros'):r.cliente;
    if(cli&&c1!==cli) return false;
    if(est&&(r.estado||'borrador')!==est) return false;
    if(fase&&(r.fase||'')!==fase) return false;
    if(txt){ const blob=((r.consecutivo||'')+' '+(c1||'')+' '+(r.solicitante||'')).toLowerCase(); if(!blob.includes(txt)) return false; }
    return true;
  });
  rows.sort((a,b)=>{ const d=numRFQ(a.consecutivo)-numRFQ(b.consecutivo); return misOrdenAsc?d:-d; });
  const body=document.getElementById('misBody');
  if(!rows.length){ body.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--slate);padding:16px;">Sin solicitudes que coincidan</td></tr>'; return; }
  if(!grp){ body.innerHTML=rows.map(r=>filaRFQ(r,true)).join(''); return; }
  // Agrupar
  const grupos={};
  rows.forEach(r=>{
    let k;
    if(grp==='cliente') k=r.cliente==='Otros'?(r.cliente_otro||'Otros'):(r.cliente||'—');
    else if(grp==='estado') k=r.estado||'borrador';
    else k=r.fase||'(sin fase)';
    (grupos[k]=grupos[k]||[]).push(r);
  });
  let html='';
  Object.keys(grupos).sort().forEach(k=>{
    const tf=grupos[k].reduce((s,r)=>s+(Number(r.presupuesto_facturacion)||0),0);
    html+='<tr style="background:#EEF3F8;"><td colspan="8" style="padding:7px 10px;font-weight:700;font-size:12px;">'+esc(k)+' <span style="font-weight:400;color:var(--slate);">· '+grupos[k].length+' RFQ · Facturación: '+money(tf)+'</span></td></tr>';
    html+=grupos[k].map(r=>filaRFQ(r,true)).join('');
  });
  body.innerHTML=html;
}
function badgeEstado(e){ const m={pendiente:'pill-warn',por_firmar:'pill-warn',aprobado:'pill-ok',rechazado:'pill-bad',borrador:'pill-gray'}; const t={por_firmar:'por firmar'}; return '<span class="pill '+(m[e]||'pill-gray')+'">'+(t[e]||e||'borrador')+'</span>'; }
function badgeFase(f){ if(!f)return '<span class="pill pill-gray">—</span>'; const m={terminado:'pill-ok',gestion:'pill-warn',restriccion:'pill-bad'}; const t={terminado:'Terminado',gestion:'Gestión',restriccion:'Restricción'}; return '<span class="pill '+(m[f]||'pill-gray')+'">'+(t[f]||f)+'</span>'; }
function filaRFQ(r,editable){
  const cli=r.cliente==='Otros'?(r.cliente_otro||'Otros'):r.cliente;
  const seg=r.segmento==='Otros'?(r.segmento_otro||'Otros'):r.segmento;
  let acc='<button class="btn-sm" onclick="verPDF(\''+r.id+'\')">📄</button>';
  if(editable&&r.estado==='borrador') acc='<button class="btn-sm" onclick="editarRFQ(\''+r.id+'\')">✏️ Continuar</button> '+acc;
  if(r.estado==='por_firmar'&&r.firma_token) acc='<button class="btn-sm" style="background:#EDE9FE;color:#6D28D9;" onclick="reenviarLink(\''+esc(r.firma_token)+'\')">🔗 Link firma</button> '+acc;
  // Editar RFQ ya emitida: si el permiso global está activo O esta RFQ está habilitada individualmente
  if((edicionHabilitada||r.edicion_habilitada)&&r.consecutivo) acc='<button class="btn-sm" style="background:#EDE9FE;color:#6D28D9;" onclick="editarRFQ(\''+r.id+'\')">✏️ Editar</button> '+acc;
  // Admin: habilitar/deshabilitar edición de ESTA RFQ (sin activar el permiso global)
  if(esAdmin&&r.consecutivo&&!edicionHabilitada){
    acc=(r.edicion_habilitada
      ? '<button class="btn-sm" style="background:#FEF3C7;color:#92600A;" onclick="toggleEdicionRFQ(\''+r.id+'\',false)">🔓 Quitar edición</button> '
      : '<button class="btn-sm" style="background:#EAF5FF;color:#0C6BC4;" onclick="toggleEdicionRFQ(\''+r.id+'\',true)">🔧 Habilitar edición</button> ')+acc;
  }
  return '<tr><td style="font-weight:600;">'+esc(r.consecutivo||'(borrador)')+'</td><td>'+esc(cli)+'</td><td>'+esc(seg)+'</td><td>'+esc(r.solicitante||'—')+'</td><td class="money">'+money(r.presupuesto_facturacion)+'</td><td>'+badgeEstado(r.estado)+'</td><td>'+badgeFase(r.fase)+'</td><td style="white-space:nowrap;">'+acc+'</td></tr>';
}
async function toggleEdicionRFQ(id,activar){
  if(!esAdmin){ alert('Solo el administrador.'); return; }
  try{
    await sb.from('rfq_solicitudes').update({edicion_habilitada:activar}).eq('id',id);
    const r=_misData.find(x=>x.id===id); if(r)r.edicion_habilitada=activar;
    pintarMis();
  }catch(e){ alert('Error: '+e.message); }
}
function reenviarLink(token){
  const base=location.href.split('?')[0].replace(/[^/]*$/,'');
  const link=base+'rqd-firma.html?token='+token;
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:6px;">\ud83d\udd17 Link para firma del aprobador</div>'+
    '<div style="display:flex;gap:8px;"><input readonly id="linkFirma" value="'+link+'" style="font-size:11px;"><button class="btn btn-p" onclick="copiarLinkFirma()">Copiar</button></div>'+
    '<div style="font-size:10px;color:var(--slate);margin-top:8px;">La RFQ se emitir\u00e1 cuando el aprobador firme.</div>'+
    '<div style="text-align:right;margin-top:12px;"><button class="btn btn-g" onclick="cerrarModal()">Cerrar</button></div>');
}

async function editarRFQ(id){
  const {data}=await sb.from('rfq_solicitudes').select('*').eq('id',id).limit(1);
  const {data:its}=await sb.from('rfq_items').select('*').eq('rfq_id',id).order('orden');
  if(!data||!data[0])return;
  rfqActual=data[0];
  items=(its||[]).map(x=>({descripcion:x.descripcion,alcance:x.alcance,cantidad:x.cantidad,unidad:x.unidad,adjuntos:x.adjuntos||[]}));
  adjuntosGen=data[0].adjuntos||[]; pasoActual=1;
  irA('nueva');
}
async function verPDF(id){
  const {data}=await sb.from('rfq_solicitudes').select('*').eq('id',id).limit(1);
  const {data:its}=await sb.from('rfq_items').select('*').eq('rfq_id',id).order('orden');
  if(!data||!data[0])return;
  const d=data[0]; const arr=(its||[]).map(x=>({descripcion:x.descripcion,alcance:x.alcance,cantidad:x.cantidad,unidad:x.unidad,adjuntos:x.adjuntos||[]}));
  const _bak=adjuntosGen; adjuntosGen=d.adjuntos||[];
  abrirModal(docHTML(d,arr,d.consecutivo,false)+'<div style="text-align:right;margin-top:14px;"><button class="btn btn-navy" onclick="imprimirPDF(\''+id+'\')">🖨 Imprimir</button> <button class="btn btn-g" onclick="cerrarModal()">Cerrar</button></div>');
  adjuntosGen=_bak;
}
async function imprimirPDF(id){
  const {data}=await sb.from('rfq_solicitudes').select('*').eq('id',id).limit(1);
  const {data:its}=await sb.from('rfq_items').select('*').eq('rfq_id',id).order('orden');
  const d=data[0]; const arr=(its||[]).map(x=>({descripcion:x.descripcion,alcance:x.alcance,cantidad:x.cantidad,unidad:x.unidad,adjuntos:x.adjuntos||[]}));
  const _bak=adjuntosGen; adjuntosGen=d.adjuntos||[];
  abrirPDF(d,arr,d.consecutivo); adjuntosGen=_bak;
}

const RENDER_admin_placeholder=true;
// ===================== FASE 2: ADMINISTRACIÓN =====================
let _cfg={umbral_smlv:13000000,smlv_valor:1300000};
let edicionHabilitada=false;
let _adminData=[];
async function cargarConfig(){
  const {data}=await sb.from('rfq_config').select('*');
  (data||[]).forEach(r=>{ if(r.clave==='umbral_smlv')_cfg.umbral_smlv=Number(r.valor); if(r.clave==='smlv_valor')_cfg.smlv_valor=Number(r.valor); if(r.clave==='edicion_habilitada')edicionHabilitada=(r.valor==='1'); });
}
RENDER.admin=async function(){
  if(!esAdmin){ document.getElementById('v-admin').innerHTML='<div class="card">Solo el administrador puede ver esta sección.</div>'; return; }
  await cargarConfig();
  const c=document.getElementById('v-admin');
  const {data}=await sb.from('rfq_solicitudes').select('*').not('consecutivo','is',null);
  // Ordenar por número de consecutivo (no alfabético)
  _adminData=(data||[]).sort((a,b)=>numOT(a.consecutivo)-numOT(b.consecutivo));
  c.innerHTML='<div class="sec-title">Administración · Relación de RFQ</div><div class="sec-sub">Umbral de restricción: '+money(_cfg.umbral_smlv)+' (10 SMLV). Solo administrador decide estado y fase.</div>'+
    '<div id="kpis" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;"></div>'+
    '<div class="card" style="padding:12px 14px;margin-bottom:12px;"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;">'+
      '<div><label>Cliente</label><select id="fl_cli" onchange="pintarAdmin()"><option value="">Todos</option>'+Object.keys(SEGMENTOS).map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+
      '<div><label>Estado</label><select id="fl_est" onchange="pintarAdmin()"><option value="">Todos</option><option>pendiente</option><option>aprobado</option><option>rechazado</option></select></div>'+
      '<div><label>Fase</label><select id="fl_fase" onchange="pintarAdmin()"><option value="">Todas</option><option value="terminado">Terminado</option><option value="gestion">Gestión</option><option value="restriccion">Restricción</option></select></div>'+
      '<div><label>Solicitante</label><input id="fl_solic" oninput="pintarAdmin()" placeholder="Buscar…"></div>'+
      '<div style="display:flex;align-items:flex-end;"><button class="btn btn-g" style="width:100%;" onclick="exportarAdmin()">⬇ Exportar CSV</button></div>'+

function numOT(cons){ if(!cons)return 0; const m=String(cons).match(/-(\d+)$/); return m?parseInt(m[1],10):0; }
function pintarAdmin(){
  const fc=document.getElementById('fl_cli').value, fe=document.getElementById('fl_est').value, ff=document.getElementById('fl_fase').value, fs=(document.getElementById('fl_solic').value||'').toLowerCase();
  let rows=_adminData.filter(r=>(!fc||r.cliente===fc)&&(!fe||r.estado===fe)&&(!ff||r.fase===ff)&&(!fs||(r.solicitante||'').toLowerCase().includes(fs)));
  // KPIs
  let tf=0,tc=0,pend=0,gest=0,restr=0,term=0,valRestr=0,adjPend=0;
  _adminData.forEach(r=>{ tf+=Number(r.presupuesto_facturacion)||0; tc+=Number(r.presupuesto_costo)||0; if(r.estado==='pendiente')pend++; if(r.fase==='gestion')gest++; if(r.fase==='restriccion'){restr++;valRestr+=Number(r.presupuesto_facturacion)||0;} if(r.fase==='terminado')term++; if(r.estado==='pendiente'&&r.adjuntos&&r.adjuntos.length)adjPend++; });
  const kpi=(t,v,col)=>'<div class="card" style="padding:12px;"><div style="font-size:10px;color:var(--slate);text-transform:uppercase;">'+t+'</div><div style="font-size:19px;font-weight:700;'+(col?'color:'+col+';':'')+'">'+v+'</div></div>';
  document.getElementById('kpis').innerHTML=kpi('RFQ emitidas',_adminData.length)+kpi('Margen total',money(tf-tc),(tf-tc)<0?'var(--danger)':'var(--green)')+kpi('Pendientes',pend,'var(--amber)')+kpi('En restricción',restr+' · '+money(valRestr),'var(--danger)');
  document.getElementById('admBody').innerHTML=rows.length?rows.map(r=>{
    const cli=r.cliente==='Otros'?(r.cliente_otro||'Otros'):r.cliente;
    const seg=r.segmento==='Otros'?(r.segmento_otro||'Otros'):r.segmento;
    const f=Number(r.presupuesto_facturacion)||0,co=Number(r.presupuesto_costo)||0,m=f-co;
    const nAdj=(r.adjuntos&&r.adjuntos.length)||0;
    let acc='<button class="btn-sm" onclick="verPDF(\''+r.id+'\')">📄</button>';
    if(r.estado==='pendiente'||(r.estado==='por_firmar'&&r.aprobador_firma)) acc+=' <button class="btn-sm" style="background:#DCFCE7;color:#166534;" onclick="modalDecision(\''+r.id+'\')">⚖ Decidir</button>';
    else if(r.estado==='aprobado') acc+=' <button class="btn-sm" style="background:#FEF3C7;color:#92600A;" onclick="modalFase(\''+r.id+'\')">🔄 Fase</button>';
    acc+=' <button class="btn-sm" style="background:#EDE9FE;color:#6D28D9;" onclick="editarRFQ(\''+r.id+'\')">✏️ Editar</button>';
    acc+=' <button class="btn-sm" style="background:#FEE2E2;color:#991B1B;" onclick="eliminarOrden(\''+r.id+'\',\''+esc(r.consecutivo||'')+'\')">🗑 Eliminar</button>';
    return '<tr><td style="font-weight:600;">'+esc(r.consecutivo)+'</td><td style="font-size:10px;">'+(r.fecha_solicitud?new Date(r.fecha_solicitud).toLocaleDateString('es-CO'):'—')+'</td><td style="font-size:11px;">'+esc(cli)+'<br><span style="color:var(--slate);">'+esc(seg)+'</span></td><td style="font-size:10px;">'+esc(r.lugar_ejecucion||'—')+'</td><td style="font-size:10px;" class="money">'+money(f)+'<br>'+money(co)+'</td><td class="money" style="color:'+(m<0?'var(--danger)':'var(--green)')+';">'+money(m)+'</td><td style="text-align:center;">'+(nAdj?'📎'+nAdj:'—')+'</td><td>'+badgeEstado(r.estado)+'</td><td>'+badgeFase(r.fase)+'</td><td style="font-size:10px;">'+esc(r.aprobador||'—')+'</td><td style="white-space:nowrap;">'+acc+'</td></tr>';
  }).join(''):'<tr><td colspan="11" style="text-align:center;color:var(--slate);padding:16px;">Sin RFQ que coincidan</td></tr>';
}

    '<div style="background:#F0FDF4;color:#166534;font-size:11px;padding:8px 10px;border-radius:8px;margin-top:10px;">✒️ Esta solicitud ya fue firmada por el aprobador al emitirse. El administrador solo define la decisión y la fase.</div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-green" onclick="confirmarAprobar()">✔ Confirmar aprobación</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div></div>';
  document.querySelectorAll('.fase-opt').forEach(l=>{ l.onclick=()=>{ document.querySelectorAll('.fase-opt').forEach(x=>x.style.background=''); l.style.background='#EEF3F8'; l.querySelector('input').checked=true; chequearJustif(); }; });
  chequearJustif();
}
function chequearJustif(){
  const r=_adminData.find(x=>x.id===document.getElementById('dec_id').value);
  const f=Number(r.presupuesto_facturacion)||0; const supera=f>=_cfg.umbral_smlv;
  const fase=(document.querySelector('input[name=fase]:checked')||{}).value;
  const w=document.getElementById('justifWrap');
  if(supera&&fase&&fase!=='restriccion'){ w.innerHTML='<div style="background:#FEF3C7;padding:8px;border-radius:8px;margin:6px 0;"><label>Justificación (supera el umbral y no es Restricción) <span class="req">*</span></label><textarea id="ap_justif" rows="2"></textarea></div>'; }
  else w.innerHTML='';
}
function setupFirmaAp(){
  const c=document.getElementById('firmaAp'); if(!c)return;
  const rect=c.getBoundingClientRect(); if(rect.width>0){c.width=Math.round(rect.width);c.height=Math.round(rect.height);}
  const ctx=c.getContext('2d'); ctx.strokeStyle='#0A2540';ctx.lineWidth=2;ctx.lineCap='round'; firmaAprob={ctx,hay:false,canvas:c}; let dib=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
  const st=e=>{e.preventDefault();dib=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  const mv=e=>{if(!dib)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();firmaAprob.hay=true;};
  const en=()=>dib=false;
  c.onmousedown=st;c.onmousemove=mv;c.onmouseup=en;c.onmouseleave=en;c.ontouchstart=st;c.ontouchmove=mv;c.ontouchend=en;
}
function limpiarFirmaAp(){ if(firmaAprob){firmaAprob.ctx.clearRect(0,0,firmaAprob.canvas.width,firmaAprob.canvas.height);firmaAprob.hay=false;} }
document.addEventListener('change',e=>{ if(e.target&&e.target.name==='fase')chequearJustif(); });
async function confirmarAprobar(){
  const id=document.getElementById('dec_id').value;
  const fase=(document.querySelector('input[name=fase]:checked')||{}).value;
  if(!fase){ alert('Seleccione una fase'); return; }
  const nom=document.getElementById('ap_nom').value.trim();
  if(!nom){ alert('Ingrese el nombre del administrador'); return; }
  const cargo=document.getElementById('ap_cargo')?document.getElementById('ap_cargo').value.trim():'';
  const r=_adminData.find(x=>x.id===id); const f=Number(r.presupuesto_facturacion)||0;
  let justif=null;
  if(f>=_cfg.umbral_smlv&&fase!=='restriccion'){ const j=document.getElementById('ap_justif'); justif=j?j.value.trim():''; if(!justif){ alert('Debe justificar por qué no asigna Restricción estando sobre el umbral'); return; } }
  try{
    // La firma del aprobador (vía link) se conserva; el admin solo decide estado y fase
    await sb.from('rfq_solicitudes').update({estado:'aprobado',fase,motivo_rechazo:null}).eq('id',id);
    await bitacora(id,r.consecutivo,'aprobar','Aprobada por admin '+nom+(cargo?' ('+cargo+')':'')+' · Fase '+fase+(justif?' · Justif: '+justif:''));
    cerrarModal(); RENDER.admin();
  }catch(e){ alert('Error: '+e.message); }
}
function mostrarRechazar(){
  document.getElementById('decBody').innerHTML='<div class="field-sec"><h3>Rechazar</h3>'+
    '<label>Motivo del rechazo <span class="req">*</span></label><textarea id="rz_motivo" rows="3" placeholder="Explique por qué se rechaza"></textarea>'+
    '<label style="margin-top:8px;">Nombre <span class="req">*</span></label><input id="rz_nom" value="'+esc(sesion.nombre==='Usuario'?'':sesion.nombre)+'">'+
    '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn" style="background:#FEE2E2;color:#991B1B;" onclick="confirmarRechazar()">✖ Confirmar rechazo</button><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button></div></div>';
}
async function confirmarRechazar(){
  const id=document.getElementById('dec_id').value;
  const motivo=document.getElementById('rz_motivo').value.trim();
  const nom=document.getElementById('rz_nom').value.trim();
  if(!motivo){ alert('El motivo del rechazo es obligatorio'); return; }
  if(!nom){ alert('Ingrese su nombre'); return; }
  const r=_adminData.find(x=>x.id===id);
  try{
    // Conserva la firma del aprobador; solo cambia el estado a rechazado con motivo
    await sb.from('rfq_solicitudes').update({estado:'rechazado',fase:null,motivo_rechazo:motivo}).eq('id',id);
    await bitacora(id,r.consecutivo,'rechazar','Rechazada por admin '+nom+' · '+motivo);
    cerrarModal(); RENDER.admin();
  }catch(e){ alert('Error: '+e.message); }
}
// Cambiar fase de una OT ya aprobada
function modalFase(id){
  const r=_adminData.find(x=>x.id===id); if(!r)return;
  abrirModal('<div style="font-size:15px;font-weight:600;margin-bottom:8px;">Cambiar fase · '+esc(r.consecutivo)+'</div>'+
    '<input type="hidden" id="dec_id" value="'+id+'">'+
    '<div style="display:flex;gap:8px;margin-bottom:12px;">'+
      '<button class="btn" style="flex:1;background:#DCFCE7;color:#166534;" onclick="setFase(\'terminado\')">Terminado</button>'+
      '<button class="btn" style="flex:1;background:#FEF3C7;color:#92600A;" onclick="setFase(\'gestion\')">Gestión</button>'+
      '<button class="btn" style="flex:1;background:#FEE2E2;color:#991B1B;" onclick="setFase(\'restriccion\')">Restricción</button>'+
    '</div><button class="btn btn-g" onclick="cerrarModal()">Cancelar</button>');
}
async function setFase(fase){
  const id=document.getElementById('dec_id').value;
  const r=_adminData.find(x=>x.id===id);
  try{ await sb.from('rfq_solicitudes').update({fase}).eq('id',id); await bitacora(id,r.consecutivo,'cambiar_fase',fase); cerrarModal(); RENDER.admin(); }catch(e){ alert('Error: '+e.message); }
}
async function eliminarOrden(id,consecutivo){
  if(!esAdmin){ alert('Solo el administrador puede eliminar \u00f3rdenes.'); return; }
  const et=consecutivo||'(borrador)';
  if(!confirm('\u00bfEliminar definitivamente la orden '+et+'?\n\nEsta acci\u00f3n no se puede deshacer. Se borrar\u00e1n la solicitud y sus \u00edtems.')) return;
  const clave=prompt('Para confirmar la eliminaci\u00f3n, escriba la clave de administrador:');
  if(clave!==CLAVE_ADMIN){ alert('Clave incorrecta. No se elimin\u00f3.'); return; }
  try{
    await sb.from('rfq_items').delete().eq('rfq_id',id);
    await sb.from('rfq_solicitudes').delete().eq('id',id);
    const {data:nuevo}=await sb.rpc('rfq_renumerar');
    await bitacora(id,consecutivo,'eliminar','Orden eliminada por '+sesion.nombre+'. Consecutivo reajustado a '+(nuevo!=null?nuevo:'?'));
    RENDER.admin();
  }catch(e){ alert('Error al eliminar: '+e.message); }
}
function exportarAdmin(){
  const cols=['consecutivo','fecha_solicitud','cliente','segmento','lugar_ejecucion','presupuesto_facturacion','presupuesto_costo','estado','fase','solicitante','aprobador'];
  const head=cols.join(',');
  const lines=_adminData.map(r=>cols.map(c=>{let v=r[c]==null?'':String(r[c]).replace(/"/g,'""');return '"'+v+'"';}).join(','));
  const csv=[head].concat(lines).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='relacion_OT.csv'; a.click();
}

// ===================== CONFIGURACIÓN =====================
RENDER.config=async function(){
  if(!esAdmin){ document.getElementById('v-config').innerHTML='<div class="card">Solo el administrador.</div>'; return; }
  await cargarConfig();
  document.getElementById('v-config').innerHTML='<div class="sec-title">Configuración</div><div class="sec-sub">Umbral de restricción y parámetros</div>'+
    '<div class="card" style="max-width:480px;"><div class="field-sec"><h3>Umbral de restricción</h3>'+
    '<label>Valor SMLV (COP)</label><input type="number" id="cf_smlv" value="'+_cfg.smlv_valor+'">'+
    '<label style="margin-top:8px;">Umbral de restricción (COP) — sugerido 10 SMLV</label><input type="number" id="cf_umbral" value="'+_cfg.umbral_smlv+'">'+
    '<div style="font-size:10px;color:var(--slate);margin-top:4px;">Cuando la facturación de una OT sea ≥ este umbral, el sistema sugerirá la fase Restricción.</div>'+
    '<div style="display:flex;gap:8px;margin-top:12px;"><button class="btn btn-p" onclick="guardarConfig()">💾 Guardar</button><button class="btn btn-g" onclick="document.getElementById(\'cf_umbral\').value=Number(document.getElementById(\'cf_smlv\').value)*10">Calcular 10 SMLV</button></div></div></div>'+
    '<div class="card" style="max-width:480px;margin-top:14px;"><div class="field-sec"><h3>Permisos de edición</h3>'+
    '<label style="display:flex;align-items:center;gap:10px;font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer;"><input type="checkbox" id="cf_edicion" '+(edicionHabilitada?'checked':'')+' style="width:auto;transform:scale(1.3);"> Permitir editar las RFQ desde la pestaña Solicitudes</label>'+
    '<div style="font-size:10px;color:var(--slate);margin-top:6px;">Cuando está activado, el botón «✏️ Editar» aparece en Solicitudes para todos los usuarios. Cuando está desactivado, nadie puede editar desde ahí.</div>'+
    '<div style="margin-top:12px;"><button class="btn btn-p" onclick="guardarPermisoEdicion()">💾 Guardar permiso</button></div></div></div>';
};
async function guardarPermisoEdicion(){
  const activo=document.getElementById('cf_edicion').checked;
  try{
    await sb.from('rfq_config').update({valor:activo?'1':'0'}).eq('clave','edicion_habilitada');
    edicionHabilitada=activo;
    await bitacora(null,null,'config_edicion','Edición en Solicitudes '+(activo?'ACTIVADA':'DESACTIVADA')+' por '+sesion.nombre);
    alert('✅ Permiso de edición '+(activo?'activado':'desactivado')+'.');
  }catch(e){ alert('Error: '+e.message); }
}
async function guardarConfig(){
  const smlv=Number(document.getElementById('cf_smlv').value)||0;
  const umbral=Number(document.getElementById('cf_umbral').value)||0;
  try{
    await sb.from('rfq_config').update({valor:String(smlv)}).eq('clave','smlv_valor');
    await sb.from('rfq_config').update({valor:String(umbral)}).eq('clave','umbral_smlv');
    _cfg.smlv_valor=smlv; _cfg.umbral_smlv=umbral;
    await bitacora(null,null,'config_umbral','Umbral '+umbral);
    alert('✅ Configuración guardada');
  }catch(e){ alert('Error: '+e.message); }
}

document.getElementById('logoTop').src=LOGO_LPS;
pintarAdminBtn();
construirTabs();
